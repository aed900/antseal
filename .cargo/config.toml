# Cargo configuration — WASM lane (P14).
#
# Normative companion doc: docs/wasm-toolchain.md (which dependency sits on
# which `getrandom` line, where each knob lives, how the lanes run).
#
# NOTE ON CWD: cargo executes a test binary — and therefore its `runner` —
# with the current directory set to the **package root** of the crate under
# test, NOT the directory cargo was invoked from. Hence the `../../` in the
# runner path below: every wasm32-tested package lives two levels below the
# workspace root (`crates/<pkg>/`, per the MVP-SPEC Architecture tree), so
# the relative path is stable for all of them and independent of where the
# developer or CI happened to run `cargo` from.

[target.wasm32-unknown-unknown]

# ── Headless wasm32 test runner (P14) ───────────────────────────────────────
# Makes `cargo test --target wasm32-unknown-unknown` execute instead of
# failing to exec a `.wasm`. The runner instantiates the libtest binary with
# `WebAssembly.instantiate` and calls its exported `main` — the module has
# ZERO imports (verified per run by the runner), so no JS glue, no
# wasm-bindgen, and no browser are involved. Precedent and prior art:
# docs/research/C11-signature-probe.md §5, which executed the pinned
# signature crates on wasm32 exactly this way and got a byte-identical
# transcript.
#
# This is a TEST-EXECUTION choice only.
#
# **[R22/D18, 2026-08-12]** It used to add that it "commits nothing about D18
# … no wasm-bindgen surface exists yet in either place". Both halves are now
# out of date: D18 is resolved (the surface is the workspace member
# `crates/antseal-wasm`), and this `runner` is what makes one half of it
# permanent — D18 §5 R10 rules that `wasm-bindgen-test` is NOT adopted,
# precisely because this key is per TARGET rather than per package, so
# replacing it would take the `wasm32-core-tests` lane down with it. The
# shipped page module is built by `scripts/wasm-pack-build.sh` and never runs
# through this runner.
runner = ["node", "../../scripts/wasm-test-runner.mjs"]

# ── The getrandom recipe (MVP-SPEC.md line 153) ─────────────────────────────
# Half of the two-part recipe for a mixed workspace. The `--cfg` below is the
# knob the getrandom **0.3 and 0.4** lines require; the other half is the
# per-crate feature knob (`wasm_js` on 0.3/0.4, `js` on the 0.2 line), which
# lives in the Cargo manifest of whichever crate first pulls getrandom into a
# wasm32 build.
#
# Today NOTHING in any wasm32 build graph pulls getrandom: antseal-core's
# normal graph is RNG-free by construction (C5/C9 take an injected
# `TryCryptoRng`; `rand_core = "=0.10.1"` is a pure trait crate), and the
# only getrandom edges in the whole lockfile come from `proptest`, which the
# wasm32 test build excludes (crates/antseal-core/Cargo.toml, target-split
# dev-dependencies). The flag is therefore inert — an unused `--cfg` is not
# an error — and it is set NOW so the recipe is already in place, in the
# durable location, on the day a getrandom-bearing dependency arrives.
#
# When that day comes, `scripts/getrandom-audit.sh` (CI lane
# `wasm32-core-tests`) fails loudly and names the missing feature knob.
rustflags = ["--cfg", "getrandom_backend=\"wasm_js\""]

# ── Upstream's state file stays inside target/ (S42, D178 R3) ───────────────
# The pinned ant-core 0.5.0 client reads, and on every drop writes,
# `client_adaptive.json` under `$XDG_DATA_HOME/ant` — else under
# `$HOME/.local/share/ant`, the directory upstream's own `ant` CLI uses — so
# every test that builds a storage client, in process or in a child that
# inherits the environment, would write into the developer's real home. This
# table sets the variable for every process cargo runs from inside the tree
# (test binaries and their children, `cargo run`, build scripts):
# `relative = true` resolves the value against the workspace root (the
# directory holding `.cargo/`), and `force = true` overrides whatever the
# shell exports. `target/` is git-ignored.
#
# It does not reach a child that clears its environment (`env_clear()` — such
# a child must set its own, as `tests/e2e_restore.rs` does), nor a cargo run
# from outside the tree with `--manifest-path`, which does not read this file
# (measured, D178). `crates/antseal-cli/tests/upstream_state.rs` asserts it,
# with a positive control.
[env]
XDG_DATA_HOME = { value = "target/upstream-data-home", relative = true, force = true }
