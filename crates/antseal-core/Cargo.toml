[package]
name = "antseal-core"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true

# Versions live ONLY in the root [workspace.dependencies]
# (docs/dependency-policy.md §2). This crate must stay WASM-safe: no I/O,
# async-runtime, or network crates may enter its normal dependency graph
# (CI lane `core-dep-graph`).
[dependencies]
# The ONLY CBOR crate allowed in this crate's dependency tree (F1 accept;
# docs/decisions/D7-cbor-crate.md). The D12 independent cross-check
# implementation (Python cbor2) is dev-tool-only and never appears here.
minicbor.workspace = true
hkdf.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
# Raw HMAC-SHA256 used to re-derive HKDF as the RFC 5869 independent
# reference (tasks/C.md C2 accept). Exact-pinned in the workspace table.
hmac.workspace = true
proptest.workspace = true

[lints]
workspace = true
