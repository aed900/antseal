[package]
name = "antseal-core"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Shared test infrastructure (Q2/Q3/Q4/Q5): the golden-vector schema/executor
# and the shared proptest strategies live in `src/test_util/` behind these
# features (docs/testing/proptest-conventions.md; testdata/vectors/README.md).
# DEV-DEPENDENCY EDGES ONLY for `test-util` — never enable it from a normal
# dependency: it activates test-only deps (proptest) that are neither
# WASM-safe nor part of the audited default/normal graph (the `wasm32-core`
# and `core-dep-graph` lanes build default features and stay meaningful).
[features]
# WASM-SAFE SUBSET (P14/Q5). Gates exactly the parts of the test-support
# surface that are I/O-free and dependency-free: the golden-vector envelope
# executor (`test_util::vectors`), the documented NON-SECRET fixture seed,
# the deterministic manifest fixtures, the deterministic fixture RNG
# (`test_util::fixture_rng`), R6's `.sealproof` fixture constructor
# (`test_util::bundle_fixtures`), and the byte accessors committed vectors
# need. It activates **ZERO optional dependencies** — that is the property
# that keeps the `core-dep-graph` verdict and the `wasm32-core` build
# unaffected no matter who turns it on, and it is why the Q5 bit-match
# harness may depend on antseal-core through a NORMAL edge with this feature.
# R6 lives here rather than under `test-util` deliberately: the
# `wasm32-core-tests` lane's dev-dependency edge enables `test-vectors` only,
# and R6's whole point is to be usable from it (R9/R10, the wasm32 lanes).
test-vectors = []
# Full test-support surface: `test-vectors` plus the proptest-bearing parts
# (shared strategies, the Q7 tamper harness). Never enabled by any
# production build (CLI, verifier page, wasm CI lanes all build without it).
# Gates: the C9 wrong-bucket mis-encryptors (C17/R7 tamper fixtures), the
# vector-generation byte accessor on the otherwise-opaque `FileSalt` (C7's
# disclosure rule vs the C3/C16 committed-vector needs), and the Q3/Q4
# shared proptest strategies + golden-vector executor.
test-util = ["test-vectors", "dep:proptest"]

# Versions live ONLY in the root [workspace.dependencies]
# (docs/dependency-policy.md §2). This crate must stay WASM-safe: no I/O,
# async-runtime, or network crates may enter its normal dependency graph
# (CI lane `core-dep-graph`).
[dependencies]
# The ONLY CBOR crate allowed in this crate's dependency tree (F1 accept;
# docs/decisions/D7-cbor-crate.md). The D12 independent cross-check
# implementation (Python cbor2) is dev-tool-only and never appears here.
minicbor.workspace = true
# The v1 storage-address function (S4, decisions D32/D35): BLAKE3-256 of the
# ciphertext bytes IS the Autonomi chunk address (`compute_address`,
# ant-protocol-2.3.0/src/data_types.rs:10-12). Feature shape and the
# no-getrandom/no-rayon/no-mmap rationale live on the workspace pin (P15);
# with default-features off the added normal graph is pure no_std Rust, so
# the `core-dep-graph` and `wasm32-core` lanes stay meaningful.
blake3.workspace = true
chacha20poly1305.workspace = true
# Hybrid author-signature stack (MVP-SPEC.md line 97; C12/C13). Feature
# selection and the D13/D14 rationale live in the workspace table; both are
# RNG-free here (keys derive from `W`, ML-DSA signs deterministically), so
# neither pulls `getrandom` into this crate's WASM-safe graph.
ed25519-dalek.workspace = true
hkdf.workspace = true
ml-dsa.workspace = true
# RFC 3161 / RFC 5652 / X.509 anchor-verification stack (A5/A8/A9; decision
# D60). These seven are declared HERE AND NOWHERE ELSE: `antseal-anchor`,
# `antseal-net` and `antseal-cli` must never declare them, because all anchor
# verification lives in this crate (MVP-SPEC.md 47-53, 106) and a second
# declaration site is how that containment erodes (A30's lane rule). Feature
# shapes and the pre-release rationale live on the workspace pins. All seven
# are RNG-free and `no_std`-shaped, so the `core-dep-graph` and `wasm32-core`
# lanes stay meaningful — measured at D60: +27 packages, zero new duplicate
# pairs, zero getrandom/rand, wasm32 green.
cms.workspace = true
const-oid.workspace = true
der.workspace = true
p384.workspace = true
rsa.workspace = true
sha1.workspace = true
x509-cert.workspace = true
rand_core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true
zeroize.workspace = true
# Optional — activated ONLY by the `test-util` feature (see [features]);
# re-exported as `antseal_core::test_util::proptest` so consumers never
# declare their own copy (single frozen version workspace-wide, Q3).
proptest = { workspace = true, optional = true }

[dev-dependencies]
# Raw HMAC-SHA256 used to re-derive HKDF as the RFC 5869 independent
# reference (tasks/C.md C2 accept). Exact-pinned in the workspace table.
# Both are pure Rust and build for wasm32, so they stay unconditional.
hmac.workspace = true
rand_chacha.workspace = true
# The RFC 3161 stack again, as DEV edges. An integration test under `tests/`
# is a separate crate and cannot see this crate's normal dependencies, and
# A5/A8's suites must build adversarial artifacts out of real ones — a
# nine-certificate bag, a 20 KiB certificate, a flipped `certHash` — which
# means decoding, mutating and re-encoding real CMS. Building those by hand
# at the byte level would make the fixtures unreadable and their derivation
# unauditable. These add ZERO packages: every one is already in the normal
# graph, and the same exact workspace pins apply.
cms.workspace = true
const-oid.workspace = true
der.workspace = true
sha1.workspace = true
x509-cert.workspace = true

# The self-dependency is the standard feature-for-tests pattern: cargo
# feature unification turns the named feature on for every test target of
# this crate while plain builds stay feature-free (`proptest` reaches
# lib-internal `cfg(test)` code through the activated optional dep). It is
# TARGET-SPLIT (P14) because `proptest` is NOT WASM-safe — it pulls
# `rusty-fork` (process spawning) and `tempfile`/`rand` (getrandom) — while
# the `wasm32-core-tests` lane executes this crate's `--lib` unit tests on
# wasm32-unknown-unknown:
#
#   native  -> test-util    (everything: strategies, tamper harness, vectors)
#   wasm32  -> test-vectors (the I/O-free, dependency-free subset)
#
# Consequence, deliberate and documented in docs/wasm-toolchain.md: the
# `proptest!` blocks and their strategy helpers inside this crate's
# `cfg(test)` modules carry `#[cfg(feature = "test-util")]`, so they compile
# and run natively and are absent from the wasm32 test binary. Property
# tests are generative and platform-independent; the wasm32 lane exists to
# execute the deterministic unit tests on the verifier's real target.
#
# Other crates consume the identical surface:
#   [dev-dependencies]
#   antseal-core = { workspace = true, features = ["test-util"] }
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
antseal-core = { workspace = true, features = ["test-util"] }
# D14's fallback implementation, consumed ONLY by
# `tests/mldsa_fallback_equivalence.rs` (Q11/D31 §9 step 6). That test is
# **T2** — same-ecosystem agreement — and is evidence for D14's fallback
# claim, never for the independent cross-check (NIST ACVP is that; see
# `tests/acvp_ml_dsa.rs`).
#
# A dev-dependency edge is not a consumed runtime dependency: `fips204` stays
# absent from `cargo tree -p antseal-core -e normal`, so D14's
# "pinned-unconsumed" property and the `core-dep-graph` lane are both
# unaffected (verified by cargo-tree diff at landing).
#
# TARGET-SPLIT for the same reason the antseal-core self-edge is: the wasm32
# lanes must not gain a dependency they have no use for. The test itself
# carries `#![cfg(not(target_arch = "wasm32"))]` to match.
fips204.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
antseal-core = { workspace = true, features = ["test-vectors"] }

[lints]
workspace = true

# U76 — D73 §4 R5 X2's distinctness instrument, the value no shipped command
# printed. `required-features` is the whole containment claim and it rides an
# EXISTING feature: `test-util` is "never enabled by any production build"
# (see [features] above), so this maintainer-side tool cannot reach a user's
# PATH, a `cargo install`, or a signed release asset — D73 §7 item 2's "a use
# case that is not a user's". Minting a feature for it instead would fail
# `scripts/gate-features.sh --check-partition` until someone classified it in
# `local-gate.sh`'s GATE_LIGHT_FEATURES.
#
# `test-util` is needed for real, exactly as `anchor-smoke-driver`'s is:
# `--self-test` builds D73 R5 X7's planted duplicate out of
# `test_util::bundle_fixtures`. And because `antseal-core/test-util` IS in
# GATE_LIGHT_FEATURES, the required tier-1 gate compiles, clippies and tests
# this target every run — it cannot rot unseen.
#
# NOT built for wasm32, by construction: the only two wasm commands in the
# tree are `cargo build -p antseal-core --target wasm32-unknown-unknown`
# (default features, so `test-util` is off and cargo skips a bin whose
# required-features are unmet) and `cargo test -p antseal-core --lib
# --target wasm32-unknown-unknown` (`--lib` excludes bin targets). The
# crate's WASM-safe library surface is untouched: this file is a bin target,
# not a module of the lib.
[[bin]]
name = "metric-vault-fp"
path = "src/bin/metric_vault_fp.rs"
required-features = ["test-util"]
