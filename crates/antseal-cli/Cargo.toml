[package]
name = "antseal-cli"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true

# D34 (docs/decisions/D34-seal-pipeline-placement.md): this package carries
# BOTH targets. The library `antseal_cli` is the orchestration layer — the
# seal/resume/restore pipelines (and, at M3, the reveal flow) as library code
# over injected backend/gate/journal/consent interfaces, so the M1 E2E can
# drive sealing without spawning the binary (MVP-SPEC.md line 154 "via
# library APIs"). The binary stays the spec tree's `antseal` with `main.rs`
# as a thin argv→lib driver.
[lib]
name = "antseal_cli"
path = "src/lib.rs"

[[bin]]
name = "antseal"
path = "src/main.rs"

# --- Feature policy (S12's recorded decision; the antseal-net precedent) ---
#
# `ant-backend` forwards to antseal-net's non-default feature of the same
# name. It declares NO new dependency edge — only a feature of the existing
# `antseal-net` edge — so S23's manifest-level allowlist
# ({antseal-net, devnet-launcher} may declare ant-core/ant-protocol/alloy/
# bytes) is untouched, and a default `cargo build/test --workspace`
# compiles none of the ~600-package graph.
#
# Why a package feature and not a plain dev-dependency: D34 Decision 3 puts
# S17's devnet harness in THIS package's integration tests, and cargo has
# no way to enable a dev-dependency's feature conditionally — a
# `features = ["ant-backend"]` dev-dep would drag the heavy graph into
# every `cargo test -p antseal-cli`, destroying exactly the containment the
# feature exists to protect. Consumers: S17's harness (`#![cfg(feature =
# "ant-backend")]`, run as `cargo test -p antseal-cli --features
# ant-backend`) and U13's `seal` wiring, the first production code here that
# must name a concrete `AntCoreBackend`. The pipeline itself is generic over
# `B: StorageBackend` and needs none of it.
[features]
default = []
ant-backend = ["antseal-net/ant-backend"]

[dependencies]
antseal-core.workspace = true
# D34 Decision 2/4: the pipeline runs A1's pre-pay anchor gate through the
# `AnchorGate` trait defined in antseal-anchor. One direction only —
# antseal-anchor never learns the pipeline exists.
antseal-anchor.workspace = true
# U4: the config file consumes S5's PURE network half (NetworkId /
# NetworkConfig — chain ids and names; contract addresses stay net's
# pinned constants, never duplicated into config). Default features only:
# the ant-backend graph must not enter this crate (containment lane
# checks `cargo tree -p antseal-cli -e normal` for alloy/ant-core).
antseal-net.workspace = true
clap.workspace = true
# Exact-pinned workspace-wide for R1's report-byte reasons (D29); consumed
# here only for the `--json` error envelope (U2; the versioned envelope
# schema is U3's).
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# --- Vault encryption stack (U6; pins + rationale in the workspace ---
# --- Cargo.toml, decision D40) ---
# The two KDFs of the vault header, the blake2 feature-forcing declaration
# (argon2's hash core — the direct edge exists to switch its `zeroize`
# feature on; see the workspace comment), the OS-CSPRNG backend, and the
# same AEAD/zeroize stack antseal-core pins — vault keys and AADs are
# vault-domain, the cipher and the hygiene discipline are the existing
# ones.
argon2.workspace = true
blake2.workspace = true
scrypt.workspace = true
getrandom.workspace = true
chacha20poly1305.workspace = true
zeroize.workspace = true
rand_core.workspace = true
# U10: the wallet sub-key is HKDF-SHA256(vault key, wallet label) — the one
# recorded exception to U6's "single vault key" schedule (blast-radius
# separation for the spend-capable secret). Same exact-pinned stack
# antseal-core derives with (sha2 carries the load-bearing D88 `zeroize`
# feature via the single workspace declaration).
hkdf.workspace = true
sha2.workspace = true
# Interactive no-echo prompt only (U7/D41); machine mode never reaches it.
rpassword.workspace = true

[dev-dependencies]
# Seeded deterministic CSPRNG for vault tests (house pattern; the
# production OS source is injected by the binary layer only).
rand_chacha.workspace = true
# D34's forced sub-finding: a `#[cfg(test)]` mock is invisible across crate
# boundaries, so `MockBackend` is exported from antseal-net behind the
# non-default `test-util` feature and enabled on THIS dev-dependency edge.
# The feature activates zero optional dependencies (it only compiles the
# mock), so the pipeline's mock-driven tests stay in the fast default lane —
# the `ant-backend` graph is a separate, opt-in feature above.
antseal-net = { workspace = true, features = ["test-util"] }
# Same pattern for the core side: the pipeline suites build real manifest
# bodies from `manifest::fixtures` rather than hand-rolling wire bytes, and
# `test_util`'s labelled NON-SECRET fixture material keeps project rule 6's
# "no key-shaped literals in fixtures" convention. Pure constant data —
# activates no optional dependency.
antseal-core = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
