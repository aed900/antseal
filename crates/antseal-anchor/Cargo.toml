[package]
name = "antseal-anchor"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true

# --- Feature policy (D90 Decision 1) ---
#
# There is deliberately NO feature gating the HTTP client. `antseal-anchor`
# is defined as the network crate ("network side only", MVP-SPEC.md lines
# 52-53), and required CI is default-features-only (`cargo clippy
# --all-targets --locked` and `cargo test --workspace --locked`, neither
# passing `--features`), so a gated network half would leave every Accept
# row of A3/A10/A13/A16/A17 — all of them local-stub unit tests — compiled
# by nothing. That is D89's coverage cliff, and D90 §4.2 refused it with
# the measurement.
[features]
default = []
# A24's stub servers, exported for other crates' tests the way antseal-net
# exports MockBackend (antseal-cli/Cargo.toml dev-deps). Activates no
# optional dependency: it only compiles the module.
test-util = []

[dependencies]
antseal-core.workspace = true
# `NetworkId` and the two chain-id constants A17's guard compares against
# (D55 §4: consumed BY NAME from `antseal_net::network`, never re-typed —
# the same discipline D84 rule F4 applies to limits). DEFAULT features only:
# `crates/antseal-net/src/network.rs` is pure data with no `ant-core`, no
# evmlib and no network I/O, compiled in the default set precisely so
# consumers can use it without the heavy graph, and `antseal-cli` already
# takes exactly this edge. Measured 2026-08-03: default `--workspace` graph
# unchanged at 145 names.
antseal-net.workspace = true
# The 8-byte TSA request nonce, drawn from the OS CSPRNG (D59 §4 puts
# generation HERE so `antseal_core::anchor::request` stays RNG-free and
# golden-vectorable). The project's own exact-pinned 0.4.3 generation, already
# a normal dependency of `antseal-cli` and `antseal-net`, so this adds no
# package and no second getrandom generation.
getrandom.workspace = true
# JSON for A17's `eth_getTransactionReceipt`/`eth_chainId` exchanges, parsed
# into `serde_json::Value` — no derive, no schema, because the two ruled
# endpoints return different key sets for the same receipt (D55 §3) and a
# typed struct would have to model the union of two vendors' spellings.
# `from_slice`'s recursion limit is left at its default 128, so an adversarial
# nesting depth is an error rather than a stack overflow. Already in the
# default `--workspace` graph via `antseal-core`: +0 packages.
serde_json.workspace = true
thiserror.workspace = true
# The anchor HTTP substrate (A3/P29; decision D90). This is the ONLY
# manifest in the workspace that may name `ureq` — the rationale, the
# graph measurements and the advisory sweep live on the workspace entry.
ureq.workspace = true

[dev-dependencies]
# A6's root-store injection API and A59's signing mock TSA
# (`antseal_core::anchor::testing`), both gated on `antseal-core/test-util`.
# A DEV edge only, and never enabled from the normal dependency above: the
# house rule is `antseal-core/Cargo.toml:10`, "DEV-DEPENDENCY EDGES ONLY for
# `test-util`". `antseal-cli` already takes this exact edge, so the workspace
# test build is unchanged, and no D60 pin is declared here — A30(c)'s owner
# set stays `antseal-core` alone.
antseal-core = { workspace = true, features = ["test-util"] }
# The SHA-256 of a merged artifact, for D103 RULING 2a's cross-check: the
# shipped `merge_upgrade` run over the committed archive bodies must reach the
# same digest the `anchor` golden vector carries for the same artifact (A14;
# `ots::upgrade::tests::the_three_way_splice_reaches_the_committed_vector_digest`).
# A DEV edge only, and it adds ZERO packages: `sha2` is already in the normal
# `--workspace` graph through `antseal-core`, on the same exact workspace pin.
sha2.workspace = true

[lints]
workspace = true
