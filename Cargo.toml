[workspace]
resolver = "3"
members = [
    "crates/antseal-core",
    "crates/antseal-anchor",
    "crates/antseal-net",
    "crates/antseal-cli",
    # Test infrastructure, never published (Q5). A member — not a standalone
    # crate like probes/sig-probe — because a bit-match between builds
    # resolved from different lockfiles would be meaningless: it must share
    # this workspace's single Cargo.lock and exact pins.
    "crates/wasm-bitmatch",
]

[workspace.package]
edition = "2024"
rust-version = "1.92.0"
# NOTE: no `license` field yet — the license decision (D6) lands later.
# Adding it is a deliberate, recorded event, not a drive-by edit.

# ----------------------------------------------------------------------------
# SINGLE version-declaration point for the whole workspace.
# Every dependency version (internal path deps included) is declared HERE and
# only here; member crates inherit with `<dep>.workspace = true`. Exact
# `=x.y.z` pins are mandatory for every format-, crypto-, or
# network-consensus-affecting dependency.
# Normative policy: docs/dependency-policy.md
# ----------------------------------------------------------------------------
[workspace.dependencies]
# Internal path dep. The explicit `version` (matching the crate's own,
# pre-publish 0.0.0) exists so the requirement is never cargo's implicit
# `*`: the cargo-deny bans lane (P13, deny.toml) rejects wildcard
# requirements workspace-wide, path deps included.
antseal-core = { path = "crates/antseal-core", version = "=0.0.0" }

# Autonomi client (exact-pin class: storage/payment surface, network
# consensus). Re-verified at M0 start, 2026-07-27: 0.5.0 is the newest
# published version, not yanked; upstream HEAD is content-identical to the
# release tag; decision KEEP. Record: docs/upstream/P9-ant-core-reverification.md;
# API survey: docs/research/S1-ant-core-api-survey.md. Consumed by
# antseal-net from M1 (until then this is the declared pin only, so it does
# not enter Cargo.lock). Bumps follow dependency-policy §4 and move in
# lockstep with the locked self_encryption version (0.36.0 at this pin; P15).
ant-core = "=0.5.0"

# EXACT-PIN CLASS (format-affecting): the deterministic-CBOR codec every
# hashed/signed/stored byte flows through (MVP-SPEC.md line 73). Decision
# record: docs/decisions/D7-cbor-crate.md (P10/F1). Features: `alloc` only —
# no `std`, no `derive` (wire formats use manual impls per D7), no `half`
# (floats are banned by the profile); minicbor 2.3.0 has no default features.
# Bumps follow docs/dependency-policy.md §4 and must keep
# crates/antseal-core/tests/cbor_pin_eval.rs green UNMODIFIED.
minicbor = { version = "=2.3.0", default-features = false, features = ["alloc"] }

# Unicode/NFC data crate (exact-pin class; decision D25,
# docs/decisions/D25-unicode-normalization.md):
# ships the Unicode 17.0.0 tables behind descriptor string "unicode-17.0.0",
# frozen into manifests. This pin may NEVER move onto a release whose
# UNICODE_VERSION differs from (17, 0, 0) — antseal-core's mapping test
# enforces that. Future Unicode versions are ADDED as distinctly named
# vendored crates; every shipped table is retained forever (MVP-SPEC.md
# line 123).
unicode-normalization = "=0.1.25"

# Exact-pin class (docs/dependency-policy.md §1): the serialized
# VerificationReport is the R9/Q4/Q5 bit-match vector byte format —
# serializer output drift is a vector break, so these move only via the
# deliberate-bump procedure (§4). Decision: docs/decisions/D29.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

# HKDF/SHA-2 stack (exact-pin class), nominated by C at M0 (tasks/C.md C1/C2; policy-table row
# "AEAD/HKDF/SHA-2 stack"). Every derived key/salt/seed and every commitment
# preimage flows through these crates, so their bytes are format-consensus.
# Verified current stable on crates.io 2026-07-27. RUSTSEC check 2026-07-27:
# sha2 — only RUSTSEC-2021-0100 (AVX2 miscompute; affects 0.9.7 only,
# patched >= 0.9.8; 0.11.0 unaffected); hkdf/hmac — no advisories on record.
# default-features = false on sha2 drops `alloc`/`oid` (unneeded; keeps the
# wasm32 surface minimal).
#
# The NON-DEFAULT `zeroize` feature is LOAD-BEARING (decision D88,
# docs/decisions/D88-hkdf-hmac-zeroization.md; task C22). It is what makes
# every dropped `Sha256`/`Hmac<Sha256>` wipe its chaining state and its block
# buffer, via real `Drop` impls on `Sha256VarCore` and (through
# `digest/zeroize` → `block-buffer/zeroize`) on `BlockBuffer`. Without it,
# measured on this exact pin: a dropped `Hkdf<Sha256>` leaves 114 of 144 bytes
# of PRK-keyed HMAC state readable, the HKDF extract context leaves the master
# secret `W` recoverable VERBATIM from its uncompressed block buffer, and every
# `content::ggm::child_seed` call strands its parent GGM seed in a dropped
# hasher — a direct contradiction of MVP-SPEC.md line 143.
#
# `crypto.rs::zeroization_sweep`'s `ZeroizeOnDrop` assertions CANNOT see this
# feature: the wipe is drop glue, not a trait bound (`digest`'s
# `buffer_fixed!` `ZeroizeOnDrop` arm is a marker impl with no `Drop`). It is
# guarded instead by three deliberately separate test binaries (C24) —
# `tests/digest_zeroize_link.rs` (compile-time: `sha2::digest::zeroize` does
# not resolve without it), `tests/feature_pins.rs` (this line still says what
# it must), and `tests/zeroization_residue.rs` (the bytes are actually wiped).
# Treat removal as a version bump under docs/dependency-policy.md §4.
#
# Cost, re-measured at C22: ~4-6% on hash-bound work, below D88 §5's 10%
# escalation gate against G18's budget. `hmac`'s own `zeroize` feature is
# deliberately left OFF — it adds nothing once this one is on (D88 §2), and an
# inert feature is a maintenance claim we would have to keep defending.
sha2 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
hkdf = "=0.13.0"
# hmac is hkdf 0.13's underlying HMAC implementation (already in the locked
# graph via hkdf's `hmac ^0.13`). Declared and exact-pinned here because it
# IS the derivation path (HKDF = HMAC extract/expand) and because
# antseal-core's tests re-derive HKDF from raw HMAC-SHA256 as the RFC 5869
# independent reference (tasks/C.md C2 accept).
hmac = "=0.13.0"

# --- Signature stack (exact-pin class; C11 probe + decisions D13/D14, ---
# --- probe artifacts: probes/sig-probe, report: docs/research/C11-signature-probe.md ---
# CONSUMED by antseal-core since C12/C13 (`ed25519-dalek`, `ml-dsa`);
# `fips204` remains declaration-only (fallback, see below).
#
# Ed25519 half of the hybrid author signature (MVP-SPEC.md line 97).
# Decision D13: 3.0.0 over the 2.x line — identical verify_strict semantics
# (probe-proven byte- and behavior-equivalent to 2.2.0) but a single crypto
# stack shared with ml-dsa: signature 3, sha2 =0.11.0 (our exact pin),
# getrandom-0.4 line. Consumption shape (C12, applied here): no rand_core
# (keys derive from W), never `legacy_compatibility` (it weakens the S >= L
# check to a 3-bit test), and `fast` (curve25519-dalek precomputed tables)
# stays OFF — C12's size/speed call, taken for the WASM verifier page and
# for exact feature parity with the C11 probe, whose behavioral evidence
# therefore applies to this build unchanged. KNOWN GAP the C12
# pre-validation layer closes: VerifyingKey::from_bytes is ZIP-215 (accepts
# non-canonical A encodings); S >= L and non-canonical/small-order R ARE
# rejected by verify_strict (probe bits 15-24).
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["alloc", "zeroize"] }

# ML-DSA-65 half (primary; decision D14). Pre-1.0, unaudited, three 2026
# advisories ALL patched in 0.1.1 (assessment in D14/P12): pin exact, track
# RUSTSEC + GHSA (RUSTSEC covers only one of the three — P13 must watch
# osv.dev/GHSA too). C11 wasm32 probe PASSED with executed native/wasm
# bit-match, so the fips204 path and the Ed25519-only sig_policy fallback
# are NOT invoked. Canonical rejection (dup/unsorted hints, count > omega,
# nonzero padding, z bound) happens at Signature::decode — probe bits 4-9.
# Consumption shape (C13, applied here): `alloc` + the NON-default `zeroize`
# (SigningKey/ExpandedSigningKey ZeroizeOnDrop); default `getrandom` and
# `pkcs8` are OFF — the deterministic profile (keygen from the HKDF-derived
# xi, sign_deterministic) needs no RNG at all.
ml-dsa = { version = "=0.1.1", default-features = false, features = ["alloc", "zeroize"] }

# ML-DSA fallback implementation (decision D14; dormant upstream since
# 2024-12 — accepted for a fallback). Kept pinned and probe-covered
# (keygen/sign byte-identical to ml-dsa, probe bits 12-13) so a swap needs
# no re-derivation work; normally never consumed by any crate. Consumption
# shape if triggered: default-features = false, features = ["ml-dsa-65"]
# (no default-rng; deterministic signing via try_sign_with_seed).
fips204 = "=0.4.6"

# XChaCha20-Poly1305 AEAD (exact-pin class: ciphertext format), nominated at
# C9 completing the policy-table AEAD row. Every unit/manifest ciphertext
# byte — permanent, paid-for network bytes whose addresses are content-
# derived — comes out of this crate (MVP-SPEC.md lines 91, 98). 0.11.0 is
# the current stable of the same RustCrypto generation as the pinned
# sha2 0.11 / hkdf 0.13 stack. Features: `alloc` only + `zeroize`
# (ChaChaPoly1305 zeroizes its key copy on drop); default features are OFF
# to exclude `getrandom` — antseal-core takes injected RNGs only (C5/C9;
# the wasm getrandom recipe is P14's problem, kept out of this graph).
# Underlying chacha20/poly1305/aead/cipher versions are frozen by Cargo.lock
# (policy §3). RUSTSEC check 2026-07-27: no advisories on record.
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }

# Secret-hygiene zeroization (exact-pin class per the policy table: its drop
# semantics are load-bearing for `W`/unit-key/passphrase handling, C5/C21).
# `alloc` for Vec-backed SecretBuf; the `derive` feature is deliberately NOT
# enabled (impls are manual — keeps syn/proc-macro out of antseal-core's
# graph). RUSTSEC check 2026-07-27: no advisories on record.
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

# Constant-time equality for commitment-digest verification (exact-pin
# class: verdict-bearing comparison semantics, C6; MVP-SPEC.md line 121
# structural checks run over adversarial bundles). default-features = false
# drops `std`/`i128` (unneeded; wasm-lean). 2.6.1 is current stable (2.6.0
# yanked). RUSTSEC check 2026-07-27: no advisories on record.
subtle = { version = "=2.6.1", default-features = false }

# RNG *trait* surface only (exact-pin class: the injected-CSPRNG API
# contract of C5/C9 generation paths). rand_core 0.10.1 is a pure trait
# crate — zero dependencies, zero features — so it structurally cannot pull
# `getrandom` into antseal-core; OS-CSPRNG wiring lives with callers
# (CLI/U; wasm recipe is P14). Note rand_core 0.10 renamed the traits:
# `CryptoRngCore` (0.6) → `CryptoRng`/`TryCryptoRng`. RUSTSEC check
# 2026-07-27: RUSTSEC-2019-0035 (<0.4.2) and RUSTSEC-2021-0023
# (0.6.0–0.6.1) do not affect 0.10.1.
rand_core = "=0.10.1"

# --- outside the exact-pin class (resolved versions frozen by Cargo.lock) ---
thiserror = "2"
# Test infrastructure only, never format-affecting: property testing
# (C3/C18; conventions in docs/testing/proptest-conventions.md, Q3).
# Resolved version frozen by Cargo.lock (1.11.0 at Q3). Reaches test code
# exclusively through antseal-core's `test-util` feature (optional dep +
# re-export) — component crates never declare proptest themselves, so one
# frozen version serves the whole workspace.
proptest = "1"
# dev-only: seeded deterministic CSPRNG for tests (C5 accept: generation is
# deterministic under a seeded test RNG). ChaCha20Rng's output stream is the
# IETF ChaCha20 spec — version-stable by definition — and no committed
# vector derives from it, so caret + lockfile freeze suffices (policy §1
# last paragraph / §3). Implements the pinned rand_core 0.10 traits.
rand_chacha = "0.10"

[workspace.lints.rust]
# `unsafe` is denied workspace-wide. Sanctioned per-crate opt-out procedure:
# a crate that genuinely needs `unsafe` adds `#![allow(unsafe_code)]` at its
# crate root together with a written justification (a doc comment at the
# allow site documenting the invariants upheld), and the exception is called
# out explicitly in review. Never weaken this lint at the workspace level.
unsafe_code = "deny"

[workspace.lints.clippy]
# Small deliberate set (P5). Panicking macros that mark unfinished/debug code
# are denied outright; `unwrap` is surfaced as a warning (CI's `-D warnings`
# hardens it) so library code grows real error types instead.
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"
