[workspace]
resolver = "3"
members = [
    "crates/antseal-core",
    "crates/antseal-anchor",
    "crates/antseal-net",
    "crates/antseal-cli",
    # Test infrastructure, never published (Q5). A member — not a standalone
    # crate like probes/sig-probe — because a bit-match between builds
    # resolved from different lockfiles would be meaningless: it must share
    # this workspace's single Cargo.lock and exact pins.
    "crates/wasm-bitmatch",
    # Devnet launcher (P16), never published — the wasm-bitmatch precedent.
    # Its DEFAULT features are EMPTY: the ~600-package ant-node graph is
    # declared behind its non-default `devnet` feature, so default
    # `--workspace` build/test lanes compile none of it (the lockfile still
    # records the full union — locks cover all member features). Only
    # scripts/devnet/local-up builds it, with --features devnet, in release
    # (D52 venue; P20 makes the containment a standing lane).
    "crates/devnet-launcher",
]

[workspace.package]
edition = "2024"
rust-version = "1.92.0"
# NOTE: no `license` field yet — the license decision (D6) lands later.
# Adding it is a deliberate, recorded event, not a drive-by edit.

# ----------------------------------------------------------------------------
# SINGLE version-declaration point for the whole workspace.
# Every dependency version (internal path deps included) is declared HERE and
# only here; member crates inherit with `<dep>.workspace = true`. Exact
# `=x.y.z` pins are mandatory for every format-, crypto-, or
# network-consensus-affecting dependency.
# Normative policy: docs/dependency-policy.md
# ----------------------------------------------------------------------------
[workspace.dependencies]
# Internal path dep. The explicit `version` (matching the crate's own,
# pre-publish 0.0.0) exists so the requirement is never cargo's implicit
# `*`: the cargo-deny bans lane (P13, deny.toml) rejects wildcard
# requirements workspace-wide, path deps included.
antseal-core = { path = "crates/antseal-core", version = "=0.0.0" }
# Same class. Declared here (single version-declaration point) for the
# consumers of `antseal-net`'s `StorageBackend`/`MockBackend`: the crate's
# own self-dev-dep (the house `test-util` feature pattern, S3 — see
# antseal-core's identical edge) and, from M1 integration, `antseal-cli`'s
# dev-dependency edge for pipeline tests (D34's forced sub-finding).
antseal-net = { path = "crates/antseal-net", version = "=0.0.0" }
# Same class. Declared here for the M1 edge D34 Decision 4 names: the seal
# pipeline in `antseal-cli` consumes A1's `AnchorGate` contract (defined on
# the A side, consumed by the pipeline — never the reverse). Dependency-
# light by construction: antseal-anchor's own graph is antseal-core +
# thiserror.
antseal-anchor = { path = "crates/antseal-anchor", version = "=0.0.0" }

# Autonomi client (exact-pin class: storage/payment surface, network
# consensus). Re-verified at M0 start, 2026-07-27: 0.5.0 is the newest
# published version, not yanked; upstream HEAD is content-identical to the
# release tag; decision KEEP. Record: docs/upstream/P9-ant-core-reverification.md;
# API survey: docs/research/S1-ant-core-api-survey.md. Consumed by
# antseal-net from M1 (until then this is the declared pin only, so it does
# not enter Cargo.lock). Bumps follow dependency-policy §4 and move in
# lockstep with the locked self_encryption version (0.36.0 at this pin; P15).
ant-core = "=0.5.0"

# EXACT-PIN CLASS, lockstep with ant-core (S6): the wire-protocol crate
# ant-core itself depends on, added as a DIRECT edge because the S6 adapter
# needs surfaces ant-core does not re-export — `QuoteHash`/`TxHash`/`Amount`
# common types, `payment::{deserialize_single_node_proof, PaymentProof}`
# (the S7 capture-consistency parse), `evm::contract::payment_vault`
# (calldata builders + `MAX_TRANSFERS_PER_TRANSACTION`), and
# `evm::utils::TransactionConfig`. ant-protocol's own header names itself
# "the single version-pin point" and asks downstream NOT to take a direct
# evmlib dep (ant-protocol-2.3.0/src/lib.rs:75-92) — this edge honors that:
# one protocol crate, no evmlib line. =2.3.0 is exactly what ant-core 0.5.0
# resolves in Cargo.lock (2.3.1 exists upstream and is deliberately NOT
# taken); the pin MOVES ONLY inside an ant-core bump review (S20,
# dependency-policy §4), never alone. Consumed by antseal-net behind the
# non-default `ant-backend` feature only.
ant-protocol = "=2.3.0"

# EXACT-PIN CLASS, lockstep with the evmlib the ant-core graph locks (D33
# Decision 4): the S6 adapter drives the external-signer payment flow —
# builds each ≤256-transfer sub-batch tx itself and awaits its receipt, the
# very object the block number is captured from — which needs the alloy
# `Provider` trait in scope plus the Ethereum `TransactionRequest`/receipt
# types. evmlib exposes its concrete provider (`Wallet::to_provider()`) but
# re-exports no trait (evmlib-0.9.0/src/utils.rs:184-200), so the trait
# import is unavoidably a direct edge. =1.8.3 is the version evmlib 0.9.0's
# caret "1.0.32" resolves in Cargo.lock; features are a strict SUBSET of
# evmlib's own activation set (evmlib-0.9.0/Cargo.toml [dependencies.alloy]),
# so this line adds ZERO packages and ZERO features to the resolved graph.
# Moves only in lockstep with an evmlib move inside an ant-core bump review.
alloy = { version = "=1.8.3", default-features = false, features = ["network", "provider-http", "rpc-types", "std"] }

# Lockstep with the locked graph (S6): `ant_core::Client::prepare_chunk_payment`
# takes `bytes::Bytes` and `DataChunk.content` is `Bytes` — the adapter must
# construct/consume the type, so the edge is required and exact-pinned to the
# version the ant-core graph already locks (adds zero packages). Consumed by
# antseal-net behind `ant-backend` only; moves only within an ant-core bump
# review.
bytes = "=1.12.1"

# EXACT-PIN CLASS (D89, 2026-08-02 — the ONE payment-stack pair that is NOT
# behind `ant-backend`). These two are what lets `antseal-net`'s **default**
# graph own the wallet light half — secp256k1 keygen/import validation,
# address derivation, EIP-55 rendering — so U11's `init` and U14's consent
# gate are compiled, linted and asserted by the required default-feature CI
# lanes instead of by a feature no required context builds (D89 Evidence 3).
#
# `k256`: **`arithmetic` only, deliberately NOT `ecdsa`.** D44 defines the
# accepted import set as what the pinned evmlib/alloy parse accepts, and that
# parse bottoms out in exactly `k256::SecretKey::from_slice` on exactly this
# version (traced in vendored source: alloy-signer-local-1.8.3/src/
# private_key.rs:224-230 -> :52-54 -> ecdsa-0.16.9/src/signing.rs:99-103), so
# calling it directly is the same predicate, not a second one. Dropping
# `ecdsa` removes `ecdsa`+`rfc6979` and, more importantly, keeps
# `signature 2.2.0`/`hmac 0.12.1` out of the graph beside the project's
# `signature 3`/`hmac 0.13`. `precomputed-tables` is off (default): one
# scalar multiplication per `init` is slower, and turning it on would add
# `once_cell` — recorded so the choice is visible, not so it is revisited.
# **LOCKSTEP: with alloy/evmlib, NOT with the project's crypto stack.** This
# pin follows whatever k256 the ant-core graph locks and moves only inside an
# ant-core bump review (policy §4); `dep-graph` rule 5 makes a fork red.
k256 = { version = "=0.13.4", default-features = false, features = ["arithmetic"] }
# Keccak-256 for EVM address derivation and EIP-55 checksum rendering. **No
# lockstep with anything**: Keccak-256 is a fixed function and the committed
# known-answer vectors (scalar-1 -> 0x7E5F...Bdf; the three checksummed
# contract constants) are the determinism authority — the `blake3` row's
# reasoning exactly. `default-features = false` drops `alloc` and `oid`; the
# whole closure (digest 0.11, keccak 0.2, hybrid-array, typenum, cfg-if,
# block-buffer 0.12, crypto-common 0.2) is already in the default normal
# graph, because sha3 0.11 sits on the same RustCrypto 0.11 generation the
# project already pins for `sha2`/`ml-dsa`.
sha3 = { version = "=0.11.0", default-features = false }

# EXACT-PIN CLASS (network-consensus-affecting; policy §1 row at P16): the
# in-process devnet node stack that ant-core's `devnet` feature activates
# (`devnet = ["dep:ant-node"]`). ant-core 0.5.0's own requirement is caret
# "0.15.0", deterministic today only by accident — no other 0.15.x is
# published and 0.16.0 (2026-07-29) is outside the caret — so the day
# upstream ships 0.15.1 a fresh resolve would silently move the entire node
# stack. This exact pin closes that window (P16 memo §5, recorded before the
# lock landed). Consumed ONLY by the never-published devnet-launcher behind
# its non-default `devnet` feature — never by a product crate; it must stay
# inside ant-core's own ant-node requirement and moves only within an
# ant-core bump review (dependency-policy §4).
ant-node = "=0.15.0"

# Async runtime (outside the exact-pin class; the resolved version is frozen
# by Cargo.lock §3 and is the same tokio the ant-core/ant-node graph
# resolves — one tokio in the tree). No default features here; each edge
# enables what it needs on its own line. The edges, each its own recorded
# decision rather than implied by this one: devnet-launcher's binary
# (rt-multi-thread/signal/time, behind its `devnet` feature); antseal-net's
# DEV-only edge (S6 recorded that the adapter library takes none — its
# futures run on the caller's runtime); and, since U36, antseal-cli's
# optional edge behind `ant-backend`, which is that caller. antseal-core
# stays tokio-free unconditionally (dep-graph lane guards it). Every
# product edge is feature-gated non-default.
# CORRECTED 2026-08-02 (D90): this previously concluded "so the default
# `--workspace` graph resolves no tokio at all" — FALSE as the `dep-graph`
# lane actually measures. `cargo tree -i tokio --workspace -e normal,build,dev`
# returns `antseal-net v0.0.0` on a DEV edge. The claim holds only for
# `-e normal` (100 packages). The distinction matters because the lane's
# edge set is what decides whether a future dev-only dependency is caught.
tokio = { version = "1", default-features = false }

# EXACT-PIN CLASS (consensus-affecting): BLAKE3-256 is the v1 storage-address
# function — S4's `compute_storage_address(blob_bytes)` in antseal-core and
# the M3 storage-linkage layer both recompute the address ant-protocol
# derives (`compute_address` = `blake3::hash`, data_types.rs:10-12). Decision
# D35 (docs/decisions/D35-self-encryption-dependency-mode.md): this pin
# REPLACES any self_encryption dependency — no antseal crate declares
# self_encryption, ever (enforced by `scripts/ci-lanes.sh dep-graph`).
# 1.8.5 = current stable on crates.io AND the version ant-core 0.5.0's
# packaged lock records — matching is tidy, not load-bearing: BLAKE3 is a
# fixed function and the golden vectors, not the crate version, are the
# determinism authority (D35 decision 3). NO lockstep semantics with
# ant-core bumps. default-features = false drops `std` (the only default);
# the resulting normal graph is pure no_std Rust (arrayref/arrayvec/cfg-if/
# constant_time_eq — no getrandom, no rand, no I/O, no threads). `rayon` is
# optional and stays OFF (nondeterministic thread pool has no place in
# core); `mmap` OFF (I/O); `wasm32_simd` OFF (one canonical portable path on
# wasm; output is implementation-independent anyway). Native x86 builds add
# target-gated `cpufeatures` (runtime SIMD dispatch) and build-dep `cc`
# (x86 asm) — neither compiles on wasm32-unknown-unknown. P15 probe
# 2026-08-01: wasm32 build PASSES with this exact shape on toolchain 1.92.0,
# and the official spec vectors (BLAKE3-team test_vectors.json) match on
# both the x86 asm path and `--features pure`. Declared pin only until S4
# consumes it (does not enter Cargo.lock; the ant-core graph's own blake3
# is lock-frozen at the same 1.8.5).
blake3 = { version = "=1.8.5", default-features = false }

# EXACT-PIN CLASS (format-affecting): the deterministic-CBOR codec every
# hashed/signed/stored byte flows through (MVP-SPEC.md line 73). Decision
# record: docs/decisions/D7-cbor-crate.md (P10/F1). Features: `alloc` only —
# no `std`, no `derive` (wire formats use manual impls per D7), no `half`
# (floats are banned by the profile); minicbor 2.3.0 has no default features.
# Bumps follow docs/dependency-policy.md §4 and must keep
# crates/antseal-core/tests/cbor_pin_eval.rs green UNMODIFIED.
minicbor = { version = "=2.3.0", default-features = false, features = ["alloc"] }

# Unicode/NFC data crate (exact-pin class; decision D25,
# docs/decisions/D25-unicode-normalization.md):
# ships the Unicode 17.0.0 tables behind descriptor string "unicode-17.0.0",
# frozen into manifests. This pin may NEVER move onto a release whose
# UNICODE_VERSION differs from (17, 0, 0) — antseal-core's mapping test
# enforces that. Future Unicode versions are ADDED as distinctly named
# vendored crates; every shipped table is retained forever (MVP-SPEC.md
# line 123).
unicode-normalization = "=0.1.25"

# Exact-pin class (docs/dependency-policy.md §1): the serialized
# VerificationReport is the R9/Q4/Q5 bit-match vector byte format —
# serializer output drift is a vector break, so these move only via the
# deliberate-bump procedure (§4). Decision: docs/decisions/D29.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

# HKDF/SHA-2 stack (exact-pin class), nominated by C at M0 (tasks/C.md C1/C2; policy-table row
# "AEAD/HKDF/SHA-2 stack"). Every derived key/salt/seed and every commitment
# preimage flows through these crates, so their bytes are format-consensus.
# Verified current stable on crates.io 2026-07-27. RUSTSEC check 2026-07-27:
# sha2 — only RUSTSEC-2021-0100 (AVX2 miscompute; affects 0.9.7 only,
# patched >= 0.9.8; 0.11.0 unaffected); hkdf/hmac — no advisories on record.
# default-features = false on sha2 drops `alloc`/`oid` (unneeded; keeps the
# wasm32 surface minimal).
#
# The NON-DEFAULT `zeroize` feature is LOAD-BEARING (decision D88,
# docs/decisions/D88-hkdf-hmac-zeroization.md; task C22). It is what makes
# every dropped `Sha256`/`Hmac<Sha256>` wipe its chaining state and its block
# buffer, via real `Drop` impls on `Sha256VarCore` and (through
# `digest/zeroize` → `block-buffer/zeroize`) on `BlockBuffer`. Without it,
# measured on this exact pin: a dropped `Hkdf<Sha256>` leaves 114 of 144 bytes
# of PRK-keyed HMAC state readable, the HKDF extract context leaves the master
# secret `W` recoverable VERBATIM from its uncompressed block buffer, and every
# `content::ggm::child_seed` call strands its parent GGM seed in a dropped
# hasher — a direct contradiction of MVP-SPEC.md line 143.
#
# `crypto.rs::zeroization_sweep`'s `ZeroizeOnDrop` assertions CANNOT see this
# feature: the wipe is drop glue, not a trait bound (`digest`'s
# `buffer_fixed!` `ZeroizeOnDrop` arm is a marker impl with no `Drop`). It is
# guarded instead by three deliberately separate test binaries (C24) —
# `tests/digest_zeroize_link.rs` (compile-time: `sha2::digest::zeroize` does
# not resolve without it), `tests/feature_pins.rs` (this line still says what
# it must), and `tests/zeroization_residue.rs` (the bytes are actually wiped).
# Treat removal as a version bump under docs/dependency-policy.md §4.
#
# Cost, re-measured at C22: ~4-6% on hash-bound work, below D88 §5's 10%
# escalation gate against G18's budget. `hmac`'s own `zeroize` feature is
# deliberately left OFF — it adds nothing once this one is on (D88 §2), and an
# inert feature is a maintenance claim we would have to keep defending.
sha2 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
hkdf = "=0.13.0"
# hmac is hkdf 0.13's underlying HMAC implementation (already in the locked
# graph via hkdf's `hmac ^0.13`). Declared and exact-pinned here because it
# IS the derivation path (HKDF = HMAC extract/expand) and because
# antseal-core's tests re-derive HKDF from raw HMAC-SHA256 as the RFC 5869
# independent reference (tasks/C.md C2 accept).
hmac = "=0.13.0"

# --- Signature stack (exact-pin class; C11 probe + decisions D13/D14, ---
# --- probe artifacts: probes/sig-probe, report: docs/research/C11-signature-probe.md ---
# CONSUMED by antseal-core since C12/C13 (`ed25519-dalek`, `ml-dsa`);
# `fips204` remains declaration-only (fallback, see below).
#
# Ed25519 half of the hybrid author signature (MVP-SPEC.md line 97).
# Decision D13: 3.0.0 over the 2.x line — identical verify_strict semantics
# (probe-proven byte- and behavior-equivalent to 2.2.0) but a single crypto
# stack shared with ml-dsa: signature 3, sha2 =0.11.0 (our exact pin),
# getrandom-0.4 line. Consumption shape (C12, applied here): no rand_core
# (keys derive from W), never `legacy_compatibility` (it weakens the S >= L
# check to a 3-bit test), and `fast` (curve25519-dalek precomputed tables)
# stays OFF — C12's size/speed call, taken for the WASM verifier page and
# for exact feature parity with the C11 probe, whose behavioral evidence
# therefore applies to this build unchanged. KNOWN GAP the C12
# pre-validation layer closes: VerifyingKey::from_bytes is ZIP-215 (accepts
# non-canonical A encodings); S >= L and non-canonical/small-order R ARE
# rejected by verify_strict (probe bits 15-24).
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["alloc", "zeroize"] }

# ML-DSA-65 half (primary; decision D14). Pre-1.0, unaudited, three 2026
# advisories ALL patched in 0.1.1 (assessment in D14/P12): pin exact, track
# RUSTSEC + GHSA (RUSTSEC covers only one of the three — P13 must watch
# osv.dev/GHSA too). C11 wasm32 probe PASSED with executed native/wasm
# bit-match, so the fips204 path and the Ed25519-only sig_policy fallback
# are NOT invoked. Canonical rejection (dup/unsorted hints, count > omega,
# nonzero padding, z bound) happens at Signature::decode — probe bits 4-9.
# Consumption shape (C13, applied here): `alloc` + the NON-default `zeroize`
# (SigningKey/ExpandedSigningKey ZeroizeOnDrop); default `getrandom` and
# `pkcs8` are OFF — the deterministic profile (keygen from the HKDF-derived
# xi, sign_deterministic) needs no RNG at all.
ml-dsa = { version = "=0.1.1", default-features = false, features = ["alloc", "zeroize"] }

# ML-DSA fallback implementation (decision D14; dormant upstream since
# 2024-12 — accepted for a fallback). Kept pinned and probe-covered
# (keygen/sign byte-identical to ml-dsa, probe bits 12-13) so a swap needs
# no re-derivation work. Since Q11/D31 it is a **dev-dependency of
# antseal-core** (native-only), consumed solely by
# `tests/mldsa_fallback_equivalence.rs`, which is D14's fallback-equivalence
# evidence and is labelled T2 — explicitly NOT the independent cross-check
# (that is NIST ACVP; D31 §4a). A `[dev-dependencies]` edge is not a
# consumed runtime dependency, so D14's "pinned-unconsumed" property and the
# `core-dep-graph` verdict both survive; see D14's 2026-07-28 addendum.
# The feature shape here IS D14's documented consumption shape if the
# fallback is ever triggered: no default-rng, deterministic signing via
# try_sign_with_seed.
fips204 = { version = "=0.4.6", default-features = false, features = ["ml-dsa-65"] }

# XChaCha20-Poly1305 AEAD (exact-pin class: ciphertext format), nominated at
# C9 completing the policy-table AEAD row. Every unit/manifest ciphertext
# byte — permanent, paid-for network bytes whose addresses are content-
# derived — comes out of this crate (MVP-SPEC.md lines 91, 98). 0.11.0 is
# the current stable of the same RustCrypto generation as the pinned
# sha2 0.11 / hkdf 0.13 stack. Features: `alloc` only + `zeroize`
# (ChaChaPoly1305 zeroizes its key copy on drop); default features are OFF
# to exclude `getrandom` — antseal-core takes injected RNGs only (C5/C9;
# the wasm getrandom recipe is P14's problem, kept out of this graph).
# Underlying chacha20/poly1305/aead/cipher versions are frozen by Cargo.lock
# (policy §3). RUSTSEC check 2026-07-27: no advisories on record.
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }

# --- Vault KDF stack (exact-pin class: vault format; decision D40, ---
# --- docs/decisions/D40-vault-kdf-selection.md; landed with U6) ---
# KDF output bytes are vault-format bytes: a crate swap or bump that changes
# output silently means every existing vault stops opening. Both KDF crates
# are therefore exact-pinned, and RFC 9106 / RFC 7914 known-answer vectors
# are committed (crates/antseal-cli/tests/vault_encryption.rs) so drift is
# loud. Re-verified current on crates.io at pin time 2026-08-01 (D40 §crate
# selection's "re-verify at pin time" clause): argon2 0.6.0 final is NOT out
# — 0.6.0-rc.8 is still the newest release — so the rc pin stands with the
# ml-dsa-precedent rc discipline (exact pin + RUSTSEC/GHSA watch, D40).
#
# argon2: the stable 0.5.3 is REJECTED (D40) — it drags a second
# blake2 0.10/digest 0.10/block-buffer 0.10 stack into the graph with no
# wiping story for the passphrase its buffers hold. 0.6.0-rc.8 rides the
# digest 0.11 generation our sha2/hkdf/hmac pins already lock. Features:
# default OFF (drops `alloc` -> we allocate the KDF arena ourselves,
# fallibly, for D40 §2's typed low-RAM error; drops `getrandom` and
# `password-hash` -> parameters live in our AAD-bound vault header, never
# PHC strings); `zeroize` ON (wipes argon2's own initial_hash/blockhash
# temporaries — measured load-bearing, see the blake2 note below).
argon2 = { version = "=0.6.0-rc.8", default-features = false, features = ["zeroize"] }
# blake2 is argon2's hash core (H0 sees the passphrase verbatim). Declared
# directly for exactly one reason — the hmac-declaration precedent: argon2's
# own `zeroize` feature does NOT forward blake2's (index metadata verified
# 2026-08-01: argon2/zeroize = ["dep:zeroize"], blake2 dep carries no
# features), and blake2's wiping `Drop` on the BLAKE2b core state
# (`self.h.zeroize(); self.t.zeroize()`, blake2-0.11.0-rc.6/src/macros.rs:
# 250-255) is gated on **blake2's own** `zeroize` feature — the same
# marker-vs-drop-glue split D88 measured for sha2. Without this line the
# passphrase-derived chaining state of every Argon2id H0 computation
# survives its drop. The D88-style residue probe
# (crates/antseal-cli/tests/kdf_residue.rs) is the behavioral guard; it was
# proven RED with this feature removed before being believed green.
# 0.11.0-rc.6 is what argon2's `^0.11.0-rc.5` resolves to today, pinned so
# an upstream rc bump is a deliberate event; its digest requirement (`^0.11`)
# unifies with the locked digest 0.11.3 — no second digest generation.
blake2 = { version = "=0.11.0-rc.6", default-features = false, features = ["zeroize"] }
# scrypt (the explicit-only alternative KDF, D40): stable, resolves onto our
# exact sha2 =0.11.0 pin including the D88 zeroize drop-glue, adding no
# second digest generation. Features: default OFF per the crate's own
# low-level-usage guidance — `password-hash`/`kdf`/`mcf` stay off (AAD-bound
# header, not PHC strings). Honest limit, recorded: scrypt 0.12.0 has no
# zeroize feature at all — its internal B/V work buffers (password-derived,
# 1 GiB at the D40 floor) are freed unwiped; the passphrase itself only
# transits pbkdf2_hmac<Sha256>, whose state the sha2/zeroize pin wipes.
scrypt = { version = "=0.12.0", default-features = false }
# OS-CSPRNG wiring for the CLI (exact-pin class: secret-generation surface —
# vault salts and record nonces are drawn from it; same rationale family as
# the rand_core row). antseal-core stays injected-RNG-only by construction
# (C5); the CLI is the sanctioned production caller that injects the OS
# source, and this is its backend. 0.4.3 = the version the locked graph
# already records (the ed25519-dalek/ml-dsa getrandom-0.4 line).
getrandom = "=0.4.3"

# No-echo terminal passphrase prompting (U7; channel decision D41 — the
# interactive half; the non-interactive half is `--passphrase-fd`, std-only).
# Exact-pinned on the zeroize-row precedent: not format-affecting, but it is
# the rawest secret-path input surface in the product — the passphrase
# transits its buffers before any type of ours can wrap it — so its version
# moves only by deliberate §4 review. Verified current on crates.io
# 2026-08-01 (7.5.4); RUSTSEC: no advisories on record. Mechanism argued at
# U7: a true no-echo prompt requires termios (tcsetattr), which std does not
# expose — the alternatives were this small vetted crate or first-party
# libc `unsafe` under the workspace deny; the crate costs two packages
# (rpassword + rtoolbox; libc is already in the graph via getrandom, and
# rtoolbox's serde/serde_json resolve onto the existing exact pins).
# Residue note, recorded honestly: rpassword's internal buffer hygiene is
# its own (rtoolbox SafeString wipes its line buffer; the returned String
# is moved straight into C's SecretBuf) — the prompt path's transient
# residue is bounded by that crate, reviewed at this pin, and it restores
# termios on drop even on panic. Consumed ONLY by the interactive prompt in
# `antseal-cli/src/passphrase.rs`; machine mode never touches it (D51).
rpassword = "=7.5.4"

# Secret-hygiene zeroization (exact-pin class per the policy table: its drop
# semantics are load-bearing for `W`/unit-key/passphrase handling, C5/C21).
# `alloc` for Vec-backed SecretBuf; the `derive` feature is deliberately NOT
# enabled (impls are manual — keeps syn/proc-macro out of antseal-core's
# graph). RUSTSEC check 2026-07-27: no advisories on record.
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

# Constant-time equality for commitment-digest verification (exact-pin
# class: verdict-bearing comparison semantics, C6; MVP-SPEC.md line 121
# structural checks run over adversarial bundles). default-features = false
# drops `std`/`i128` (unneeded; wasm-lean). 2.6.1 is current stable (2.6.0
# yanked). RUSTSEC check 2026-07-27: no advisories on record.
subtle = { version = "=2.6.1", default-features = false }

# RNG *trait* surface only (exact-pin class: the injected-CSPRNG API
# contract of C5/C9 generation paths). rand_core 0.10.1 is a pure trait
# crate — zero dependencies, zero features — so it structurally cannot pull
# `getrandom` into antseal-core; OS-CSPRNG wiring lives with callers
# (CLI/U; wasm recipe is P14). Note rand_core 0.10 renamed the traits:
# `CryptoRngCore` (0.6) → `CryptoRng`/`TryCryptoRng`. RUSTSEC check
# 2026-07-27: RUSTSEC-2019-0035 (<0.4.2) and RUSTSEC-2021-0023
# (0.6.0–0.6.1) do not affect 0.10.1.
rand_core = "=0.10.1"

# --- outside the exact-pin class (resolved versions frozen by Cargo.lock) ---
thiserror = "2"
# OS-CSPRNG entropy for antseal-net's EVM wallet keygen (S5; U11's generate
# path), consumed ONLY behind net's non-default `ant-backend` feature.
# Outside the exact-pin class by the policy's own test (§1): no byte it
# produces is hashed, signed, stored, or paid for AS an output format — it
# seeds a fresh secp256k1 scalar whose validity and downstream use are gated
# by the pinned evmlib/alloy parse (D44's "accepted set = what the pinned
# stack accepts"). Resolved version frozen by Cargo.lock (0.3.4 — already in
# the locked graph transitively via the ant-core stack, so this line adds no
# new package). antseal-core NEVER declares it: the core-dep-graph lane bans
# getrandom/rand from core's normal graph (S4's no-RNG audit).
# KEY ALIAS (wave-2 stage-A merge fix): the plain `getrandom` key above is the
# CLI's exact-pinned 0.4 generation; this 0.3-generation entry keeps its own
# deliberately-distinct rationale under an aliased key — two generations
# coexist on purpose, one per consumer, neither silently absorbing the other.
getrandom03 = { package = "getrandom", version = "0.3" }
# URL type for constructing evmlib's `CustomNetwork` (S5's devnet →
# EvmNetwork mapping, behind `ant-backend`). `CustomNetwork.rpc_url_http`
# is `reqwest::Url`, which IS `url::Url` re-exported
# (reqwest-0.12.28/src/lib.rs:280). NOTE (D90, 2026-08-02): the lock carries
# TWO reqwest generations — 0.12.28 via ant-core and 0.13.4 via
# alloy/ant-node/saorsa-transport. The single-`url` claim below still holds
# (both resolve 2.5.8); it is the reqwest count that is not one.
# So this must resolve to the same `url`
# the evmlib graph uses — the lock resolves exactly one (2.5.8), and any
# future skew is a COMPILE error in the struct literal, never silent
# drift. Chosen over calling `CustomNetwork::new`, whose parse `expect`s
# (evmlib-0.9.0/src/lib.rs:90-99) — parsing ourselves keeps the no-panic
# rule.
url = "2"
# HTTP client for anchor acquisition (A3; decision D90,
# docs/decisions/D90-anchor-http-substrate.md). Declared by
# `antseal-anchor` ALONE and UNGATED: required CI is default-features-only
# (ci.yml:122, :148), so a feature-gated network half would leave every
# Accept row of A3/A10/A13/A16/A17 — all of them local-stub unit tests —
# compiled by nothing, the D89 coverage cliff one milestone later. Measured
# 2026-08-02: default `--workspace` graph 129 -> 144 (+15 names, 25-package
# closure); ant-backend 447 -> 451; devnet 475 -> 479; four names new to
# Cargo.lock (ureq, ureq-proto, utf8-zero, webpki-roots). Every other crate
# in the closure resolves to the version the lock ALREADY carries —
# including `subtle 2.6.1` and `zeroize 1.9.0`, the project's own exact
# pins — and it brings no `digest`/`sha2`, so no second RustCrypto
# generation enters (rustls hashes through `ring`).
#
# BLOCKING, deliberately. `antseal-anchor` creates no runtime, borrows
# none, and requires no async context: `AnchorGate::run` keeps its frozen
# `async fn` signature and completes in ONE poll under the noop-waker
# executor `gate.rs` already uses (D90 probe 6). That is what makes A15/U24
# — an upgrade attempt on EVERY CLI invocation, in builds where tokio is
# not compiled in at all — implementable. reqwest's `blocking` feature is
# not an alternative: it is `tokio/sync` plus a background runtime, and
# costs +72 default packages against ureq's +15.
#
# EXACT-PINNED though it is outside dependency-policy §1's format/crypto/
# consensus class — the `rpassword` row's reason: it is the sole path by
# which adversary-controlled bytes enter the process before any parser of
# ours sees them, and three of its behaviours are load-bearing contracts a
# minor bump could move silently (`.limit(N)` accepts N-1 bytes;
# `max_redirects(0)` RETURNS the 3xx instead of erroring; `Config::default`
# reads HTTP_PROXY/ALL_PROXY from the environment). NO lockstep with
# anything.
#
# default-features = false drops `gzip` (flate2/miniz_oxide/crc32fast/
# adler2/simd-adler32 — 5 packages) and, with it, the whole
# decompression-bomb path under A28's streaming byte ceiling: a limit on a
# compressed body bounds the wrong number. `rustls` = rustls 0.23 over
# `ring` with the compiled `webpki-roots` snapshot — pinned trust, not the
# OS store, the same discipline as A6's pinned TSA roots one layer down.
# `webpki-roots` is NOT declared directly: it arrives through ureq and is
# frozen by Cargo.lock §3; an ureq bump review must state which
# webpki-roots it moves to.
#
# RUSTSEC + GHSA/osv.dev sweep 2026-08-02T19:32:36Z: zero advisories on
# record for ureq, ureq-proto, utf8-zero, webpki-roots and httparse; rustls
# 0.23.43, ring 0.17.14 and rustls-webpki 0.103.13 are each past every
# advisory on record (rustls-webpki sits exactly on RUSTSEC-2026-0104's
# fix). Licence MIT OR Apache-2.0; rust-version 1.85 <= the 1.92.0 pin.
ureq = { version = "=3.3.0", default-features = false, features = ["rustls"] }
# CLI argument surface (U1). Outside the exact-pin class by the policy's own
# §1 text (which names clap): nothing format-, crypto-, or consensus-
# affecting flows through it, so a caret-major requirement + the committed
# Cargo.lock (§3) is the governance (resolved 4.6.5 at U1, verified current
# on crates.io 2026-08-01). Two extra guards make even a deliberate §4 bump
# loud: U1's committed help-surface snapshot pins the rendered output, and
# `Command::debug_assert` pins the parse-tree invariants. Features are
# minimal and deliberate: default features OFF to exclude `color` (no ANSI —
# byte-stable snapshots, clean piping) and to keep `wrap_help` out (no
# terminal-size probing — help renders identically on every terminal and in
# CI); `std` is clap's mandatory base; `derive` is U1's task-text choice
# (tasks/U.md:13 "clap derive"); help/usage/error-context/suggestions keep
# parse errors actionable. Growth (e.g. `env`) would be a reviewed event.
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
# Structured logging for the CLI (U1): stderr only, env-filter driven —
# RUST_LOG is the sanctioned verbosity surface; the canonical flag surface
# is closed and gains no verbosity flags (tasks/U.md:13). Outside the
# exact-pin class (policy §1); resolved versions (0.1.44 / 0.3.23 at U1)
# frozen by Cargo.lock. tracing-subscriber: default features OFF drops
# `ansi` (no color codes on stderr — logs stay grep/pipe-clean) and pulls
# exactly the fmt writer + RUST_LOG filtering.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
# Test infrastructure only, never format-affecting: property testing
# (C3/C18; conventions in docs/testing/proptest-conventions.md, Q3).
# Resolved version frozen by Cargo.lock (1.11.0 at Q3). Reaches test code
# exclusively through antseal-core's `test-util` feature (optional dep +
# re-export) — component crates never declare proptest themselves, so one
# frozen version serves the whole workspace.
proptest = "1"
# dev-only: seeded deterministic CSPRNG for tests (C5 accept: generation is
# deterministic under a seeded test RNG). ChaCha20Rng's output stream is the
# IETF ChaCha20 spec — version-stable by definition — and no committed
# vector derives from it, so caret + lockfile freeze suffices (policy §1
# last paragraph / §3). Implements the pinned rand_core 0.10 traits.
rand_chacha = "0.10"

[workspace.lints.rust]
# `unsafe` is denied workspace-wide. Sanctioned per-crate opt-out procedure:
# a crate that genuinely needs `unsafe` adds `#![allow(unsafe_code)]` at its
# crate root together with a written justification (a doc comment at the
# allow site documenting the invariants upheld), and the exception is called
# out explicitly in review. Never weaken this lint at the workspace level.
unsafe_code = "deny"

[workspace.lints.clippy]
# Small deliberate set (P5). Panicking macros that mark unfinished/debug code
# are denied outright; `unwrap` is surfaced as a warning (CI's `-D warnings`
# hardens it) so library code grows real error types instead.
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"

# ----------------------------------------------------------------------------
# Dev/test optimization overrides for the memory-hard KDF stack (U6).
# Argon2id at the D40 floor touches 256 MiB three times per derivation and
# scrypt-at-floor streams 1 GiB; unoptimized these turn the U6 KATs and
# vault round-trip tests from seconds into minutes. Optimization level
# changes no output byte — the committed RFC 9106/7914 known-answer vectors
# are exactly the tests that would catch it if it could — and debug
# assertions stay on for every workspace crate (these are all external
# dependencies). Measured on this 2-core host (2026-08-01), per derivation
# at the frozen parameters: Argon2id 9.2 s unoptimized debug vs 0.7 s with
# these overrides (0.68 s release); scrypt 64 s vs 2.4 s (2.4 s release) —
# the U6 suite (~12 Argon2id + 3 scrypt derivations) would cost ~5 min
# unoptimized and runs in ~23 s with the overrides.
# ----------------------------------------------------------------------------
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
