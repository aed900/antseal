# antseal weekly advisory sweep (P13; decision D19).
#
# WHY A SEPARATE WORKFLOW: a new RUSTSEC advisory against a pinned
# dependency must surface even when nothing is pushed (P13 accept: the
# scheduled run is independent of PR traffic). GitHub runs `schedule:`
# triggers against the DEFAULT BRANCH only, so this file is inert until it
# lands on main (docs/ci-verification.md tracks the remote-run status).
# `workflow_dispatch` allows a manual run for the D19/P13
# red-lane demonstration (add a synthetic ignore/advisory on a branch and
# dispatch it) and for on-demand sweeps.
#
# Same pinned tool + same command as the per-PR `audit-deny` job in
# ci.yml: cargo-deny =0.19.8 (docs/dependency-policy.md §5; NO cargo-audit
# per D19 — deny's advisories check reads the same RUSTSEC DB), checks
# advisories, bans, sources and licenses (all four named explicitly against
# the committed deny.toml). Job name `advisory-weekly` is NOT a PR status
# context and never becomes one.
#
# Follow-up on red (Q10 owns the permanent process): a failing weekly run
# means a new advisory landed — open a tracking issue, write the
# applicability assessment (dependency-policy §4), and either bump or add
# a justified, review-dated ignore to deny.toml.
name: advisory-cron

on:
  schedule:
    # Mondays 06:17 UTC (off the top-of-hour load spikes GitHub docs warn
    # about; weekly cadence per P13/D19 and the P19 upstream-check rhythm).
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Q16 — the no-real-anchor-network policy, ARMED here rather than stated in
  # a doc. Workflow-level so EVERY job inherits it, including jobs added
  # later that nobody remembers to arm. It makes
  # `antseal_anchor::http::HttpClient` refuse any endpoint that is not a
  # loopback IP literal, so a test that reaches for a real TSA, OTS calendar,
  # esplora or Arbitrum RPC fails instead of hammering a rate-limited
  # third-party service (MVP-SPEC.md line 189). The `cfg(test)` half needs no
  # variable and cannot be switched off at all; this covers the integration-
  # test binaries it structurally cannot reach. Asserted by
  # `scripts/ci-lanes.sh anchor-net-policy` — an arming nothing checks is an
  # arming that silently disappears. Policy: docs/testing/anchor-ci-policy.md
  ANTSEAL_NO_REAL_ANCHOR_NETWORK: "1"

jobs:
  advisory-weekly:
    name: advisory-weekly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rustup show (toolchain from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Cache pinned cargo-deny binary
        id: deny-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.19.8-${{ runner.os }}
      - name: Install pinned cargo-deny (docs/dependency-policy.md §5)
        if: steps.deny-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --version 0.19.8 --locked
      - name: cargo deny (advisories, bans, sources, licenses)
        run: ./scripts/ci-lanes.sh audit-deny
