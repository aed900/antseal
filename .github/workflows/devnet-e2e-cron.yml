# antseal scheduled devnet E2E (Q15; decision D52).
#
# WHY A SEPARATE, SCHEDULED WORKFLOW — and never a PR status context:
# D52 chose a **required LOCAL gate** (`scripts/e2e-devnet.sh`, mandatory
# before merging storage-touching changes) plus **this** non-required
# scheduled leg. A per-PR devnet job was rejected on four recorded grounds:
# branch protection 403s on this plan, so a 20th *required* context is
# unenforceable (docs/ci-verification.md, "Branch protection is BLOCKED BY
# PLAN"); the hosted runner is the same 2-core class as the dev machine, so
# it adds no headroom; the devnet target dir would fight the 10 GiB per-repo
# cache cap with all 19 existing lanes; and S18's SIGKILL/timing matrix is
# flake-prone on shared runners, where a non-required red trains people to
# ignore red. What this leg is FOR is the other half of Q43's evidence rule
# — "a lane that has never run on the remote is not evidence" — plus an
# upstream-drift tripwire between pushes.
#
# GitHub runs `schedule:` triggers against the DEFAULT BRANCH only, so this
# file is inert until it lands on main (docs/ci-verification.md tracks the
# remote-run status). `workflow_dispatch` is how the FIRST measured runs
# happen: D52 lands this lane conditionally — if the measured runtime does
# not fit the minutes budget, the lane is deleted and the measurement is
# recorded instead (D52 §Decision 2, the D→C degradation).
#
# Job name `devnet-e2e-scheduled` is NOT a PR status context and never
# becomes one; the required-context set stays at 19 (Q56).
#
# TRIAGE (D52 residual risk 2, verbatim in intent): a red scheduled run gets
# a tracking note in the next wave's bookkeeping; **two consecutive reds
# block storage-wave starts** until diagnosed.
#
# PROMOTE TO REQUIRED — the recorded trigger: a plan upgrade (Pro) or the
# Q65-gated public flip makes required contexts real; then, after **>=20
# clean scheduled runs with warm runtime <=15 min**, this lane may be
# promoted to a required context by adding it to the branch-protection
# payload (docs/ci-verification.md, "Maintainer runbook"). Not before.
name: devnet-e2e-cron

on:
  schedule:
    # WEEKLY, Wednesdays 05:37 UTC — off the top-of-hour load spikes GitHub
    # documents, offset from fuzz-nightly (daily 03:41) and advisory-cron
    # (Mondays 06:17) so no two heavy jobs queue together.
    #
    # Weekly rather than D52's estimated daily, deliberately: see the cache
    # note on the job below. Without a shared cargo cache every run is a
    # cold build of the ~736-package devnet graph, so the affordable cadence
    # is weekly until the first dispatches measure the real cost. Cadence is
    # a one-line change once the measurement exists.
    - cron: "37 5 * * 3"
  workflow_dispatch:
    inputs:
      nodes:
        description: "Devnet node count (7..=25). MUST be >= ant-protocol CLOSE_GROUP_SIZE (7) or every paying test fails; 14 is the evidence-backed working size (P16). See the note on the env below."
        required: false
        default: "14"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Q16 — the no-real-anchor-network policy, ARMED here rather than stated in
  # a doc. Workflow-level so EVERY job inherits it, including jobs added
  # later that nobody remembers to arm. It makes
  # `antseal_anchor::http::HttpClient` refuse any endpoint that is not a
  # loopback IP literal, so a test that reaches for a real TSA, OTS calendar,
  # esplora or Arbitrum RPC fails instead of hammering a rate-limited
  # third-party service (MVP-SPEC.md line 189). The `cfg(test)` half needs no
  # variable and cannot be switched off at all; this covers the integration-
  # test binaries it structurally cannot reach. Asserted by
  # `scripts/ci-lanes.sh anchor-net-policy` — an arming nothing checks is an
  # arming that silently disappears. Policy: docs/testing/anchor-ci-policy.md
  ANTSEAL_NO_REAL_ANCHOR_NETWORK: "1"

jobs:
  devnet-e2e-scheduled:
    # NOT a PR status context and never becomes one.
    name: devnet-e2e-scheduled
    runs-on: ubuntu-latest
    # Generous by design: a cold release build of the devnet graph plus the
    # suites. A slow runner must be reported as slow, not as a hang — and
    # this number is one of the things the first runs measure.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: rustup show (toolchain from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      # NO `Swatinem/rust-cache` here, deliberately — this is the one lane
      # in the repo that omits it. D52 evidence E3: the devnet target dir
      # (est. 4-8 GiB) would compete inside GitHub's 10 GiB per-repo cache
      # budget with the caches of all 19 required lanes plus the fuzz corpus
      # round-trip, and eviction thrash would slow every lane to speed this
      # one. A non-required weekly job does not get to tax the required
      # ones. Revisit only if the plan's cache budget changes.

      # anvil is host tooling the launcher spawns via PATH (evmlib / alloy
      # node-bindings); the local host installs it with foundryup
      # (docs/devnet/local-devnet.md, Host requirements). Third-party action
      # edge accepted on the same footing as Swatinem/rust-cache@v2, and
      # pinned — as of D143 — to the 40-hex COMMIT that `v1` pointed at when
      # the pin was taken, not to the major tag this sentence used to name.
      # `.github/action-pins.tsv` is the authority and
      # `scripts/check-action-pins.py` keeps the two in step. What the pin
      # buys is that the request is SPECIFIC — a maintainer can no longer
      # re-point the tag under us. It is not a checksum anything verifies:
      # the runner sends {owner, repo, ref} to the Actions service and
      # extracts whatever tarball comes back (D143 §1.4). `version: stable`
      # is the toolchain this action installs and is NOT covered by the
      # ledger (D143 §5.6). `version: stable` rather than a literal we
      # cannot verify from here: D52 residual risk 5 is venue drift, and the
      # mitigation is that `scripts/e2e-devnet.sh` prints the actual
      # `anvil --version` into its evidence line in BOTH venues, so a
      # divergence from the host's 1.5.1-stable is recorded, not ambient.
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: stable

      # Q243/Q154 — the TEST-OF-THE-TEST, run in the venue that PUBLISHES
      # the result rather than only on a machine that never does. Until this
      # step existed, `redact()` and the suite-registry rules were proven
      # exclusively by scripts/local-gate.sh, while the one job that turns
      # this script's output into a downloadable artifact invoked it bare —
      # so the guard protecting a funded key's neighbourhood in a published
      # artifact was proven everywhere except where it publishes.
      #
      # BEFORE the capture on purpose: a filter proven after the fact is
      # proven too late. This is the same two-step shape ci.yml already uses
      # for the cross-check's `--self-test` and `--check` halves.
      - name: Self-test — prove the registry rules, the redaction filter and the artifact scan can go red
        run: ./scripts/e2e-devnet.sh --self-test

      # The same script bytes AND, since Q243, the same INVOCATION the local
      # gate runs (the ci-lanes.sh rule): the step above is local-gate.sh's
      # `e2e-selftest` lane and this one is its `e2e-devnet` lane.
      # S17-S19 are written now and DO run (proven by run 31571938292, which
      # executed all four suites); the PENDING path remains for any suite the
      # registry still lists as unwritten — never a silent pass.
      - name: Devnet E2E (D52 scheduled leg — same script as the local gate)
        env:
          # 14 — the scripts' OWN default, NOT the 5 D52 specified for this
          # lane. `ant-protocol-2.3.0/src/chunk.rs:35` sets
          # `CLOSE_GROUP_SIZE = 7` and a client fetches quotes from the 7
          # closest nodes, so a 5-node devnet cannot quote AT ALL. The only
          # scheduled run this lane has ever had (31571938292, 2026-08-12,
          # `3c8095a`) failed ALL FOUR suites with `witnessed close group
          # initial lookup found 5 peers, need 7`.
          #
          # The tree already knew: P16's research says *"10-14 nodes is the
          # evidence-backed working size (>=7 fills the close group)"* and
          # that 5 is *"usable for smoke, not for the flagship suite"*
          # (docs/research/P16-devnet-feasibility.md:138-146), and
          # docs/devnet/local-devnet.md:51 labels 5 *"degraded quorums"*.
          # This lane ran the flagship suite at the smoke count anyway.
          #
          # The reduction bought nothing measurable: boot is 1.4s at 5 nodes
          # and 6.2s at 14 (P16), against this run's 13m07s cold build. Using
          # the scripts' default also restores the lane's own stated principle
          # — the same script bytes the local gate runs.
          ANTSEAL_DEVNET_NODES: ${{ github.event.inputs.nodes || '14' }}
        run: ./scripts/e2e-devnet.sh

      # Q243 — the check on the OUTPUT, not on the filter. `redact()` runs at
      # capture time inside the step above; this reads what that step actually
      # wrote and refuses if anything key-shaped survived. It is the half that
      # keeps meaning something after a refactor that stops calling `redact()`
      # at all, which is the failure the redactor's own self-test structurally
      # cannot see. It gates the upload below: a directory with a finding is
      # not published.
      #
      # `always()` because the FAILURE path captures the most — node and Anvil
      # logs are captured on both paths and a failing run's are the larger —
      # so scanning only on success would skip the bigger artifact.
      - name: Redaction scan — refuse to publish evidence carrying key-shaped material
        id: evidence-scan
        if: always()
        run: ./scripts/e2e-devnet.sh --scan-evidence

      # WHAT THIS ARTIFACT IS, WHO CAN READ IT, AND FOR HOW LONG (Q243).
      #
      # CONTENTS — `target/e2e-devnet/<UTC-timestamp>-<short-sha>/`:
      #   local-up.log   the launcher's stdout while booting the devnet
      #   launcher.log   node + Anvil output (Anvil is the launcher's child),
      #                  passed through `redact()` on the way in
      #   manifest.json  the devnet manifest, also redacted — its
      #                  `wallet_private_key` field carries the funded Anvil
      #                  dev account, a well-known public constant that still
      #                  never leaves in key shape (project rule 6)
      #   suite-S*.log   `cargo test … -- --nocapture` output, one per suite
      #   evidence.txt   the one-line dated verdict
      # `.devnet/env` is deliberately never captured, in any form.
      # Measured size, artifact 9132238802 from run 31571938292 (2026-08-12):
      # 52,269 bytes.
      #
      # AUDIENCE — an artifact inherits the repository's CURRENT visibility,
      # not the visibility it had when it was written. Today that is the
      # maintainer alone, because the repository is private. After the Q65
      # flip it is every GitHub account: artifact BYTES need a signed-in user
      # with read access (an unauthenticated GET of …/artifacts/{id}/zip is
      # 401), while artifact METADATA — name, size, owning run — is readable
      # with no account at all. GitHub's visibility-change page states that
      # "Actions history and logs will be visible to everyone" and points at
      # deleting existing runs and artifacts BEFORE flipping, so artifacts
      # written while private are exposed by the flip, not grandfathered.
      # (CORRECTED 2026-08-18 by D145 §1: GitHub's visibility-change page does
      # not itself instruct you to delete runs or artifacts first — it states
      # that "Actions history and logs will be visible to everyone" and points
      # at the management docs. The exposure claim is right; the sourcing was
      # overstated. Note also the audience asymmetry: artifact BYTES need a
      # signed-in user with read access — an unauthenticated GET of the zip
      # returns 401 — while artifact METADATA is anonymously readable.)
      #
      # RETENTION — 90 days, measured rather than assumed: artifact 9132238802
      # was created 2026-08-12T07:19:54Z and expires 2026-11-10T06:56:33Z,
      # exactly 90 days after its run began. 90 is GitHub's default and also
      # the MAXIMUM a public repository may configure (private and internal
      # may set up to 400), so the flip caps this where it already sits.
      # RULED at 30 days by D145 §2 R1 (2026-08-18), and the value is chosen
      # by the rule that READS this store rather than by risk appetite. This
      # workflow's own triage rule (see the header, "two consecutive reds
      # block storage-wave starts until diagnosed") needs the previous red's
      # evidence to still exist when the next one fires. At weekly cadence an
      # artifact from run T-7k lives iff 7k < R: R=7 keeps exactly ONE alive,
      # so the first red's diagnosis expires the day the second fires and the
      # rule becomes unexecutable from its own store. R=14 keeps 2, R=30
      # keeps 5, R=90 keeps 13. Q247 counts its twenty runs from here, so
      # shortening had a reader — which is why this was a decision, not a
      # knob, and why the Q243 lane returned it to planning rather than
      # picking a number.
      #
      # WHAT THIS SETTING CANNOT REACH, measured by D145 §1: six of the eight
      # evidence files are written through `tee` and are duplicated VERBATIM
      # into the job log, which has its own retention and which no gate here
      # can refuse. This setting therefore governs 525 954 of 620 748 B. The
      # remainder leaves through the log; fixing it at the write (`| redact |
      # tee`) rather than at the upload is Q256.
      #
      # `always()`, not `failure()`: on failure this is the node + Anvil log
      # capture Q15's Accept requires, and on success it is the runtime
      # measurement D52's conditional-landing rule is waiting for. The scan's
      # outcome is ANDed in so that "always" can never mean "even when it
      # leaks".
      - name: Upload evidence, node and Anvil logs
        if: always() && steps.evidence-scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devnet-e2e-evidence
          path: target/e2e-devnet/
          if-no-files-found: ignore
          # D145 §2 R1. Not a default: see the reasoning above.
          retention-days: 30
