# antseal CI — P8 skeleton, extended to the full M0 matrix by Q1.
#
# Toolchain: taken exclusively from rust-toolchain.toml — the rustup step in
# every job installs from that file; no toolchain version is ever hardcoded
# here (docs/toolchain.md).
# Lockfile: every dependency-resolving lane runs --locked, so lockfile drift
# fails loudly (docs/dependency-policy.md §3).
#
# ── Extension points ────────────────────────────────────────────────────────
# Jobs are deliberately small named units: extend by ADDING jobs, not by
# folding steps into existing lanes. Every job `name:` is a (future)
# required status context for branch protection (runbook:
# docs/ci-verification.md) — NEVER rename a job once it has landed on main.
# A domain task claims its mount-point job by replacing the placeholder step
# body only, keeping id and `name:` (CONTRIBUTING.md "CI lanes").
#
# Task-ID map (corrected by Q1 — the P8 header had fuzz under "Q1" and
# vector retention under "Q9"; authoritative IDs are per tasks/Q.md):
#   Q4:  golden-vectors — LANDED: native runner over testdata/vectors/
#        (discovery walk, no hardcoded lists; testdata/vectors/README.md)
#   Q5:  wasm-bitmatch — LANDED: native<->WASM bit-match over every committed
#        golden vector, built on P14's runner technique. Harness:
#        crates/wasm-bitmatch (test-only). Doc: docs/wasm-toolchain.md
#   Q6:  vector-freeze — LANDED as a NEW lane (a new required-status
#        context, +1 on the branch-protection payload — see
#        docs/ci-verification.md). Per-version FROZEN.sha256 freeze +
#        must-exist guard over testdata/vectors/v<n>/; driver
#        scripts/vector-freeze.sh, checker
#        crates/antseal-core/tests/vector_freeze.rs
#   Q7/Q8: tamper-matrix — LANDED (mount point claimed at Q8; job id and
#        `name:` unchanged, so the required-status context is unaffected).
#        Q7's distinct-error harness plus Q8's completeness registry
#        (testdata/tamper/MATRIX.json) mapped 1:1 onto MVP-SPEC.md line 168
#   Q13/Q37: traceability — LANDED as a NEW lane. It is a NEW
#        required-status context: docs/ci-verification.md needs its row and
#        the branch-protection payload needs +1. NEITHER IS DONE HERE —
#        that file was held by another lane in this wave, and changing
#        branch protection is an external action requiring express consent.
#        Both are reported as outstanding. Python-only, no cargo. Checks the
#        verification-coverage matrix (docs/testing/verification-matrix.md)
#        resolves every test it names, and that D84 section 7's freeze-boundary
#        rows have not drifted between their copies. Script:
#        scripts/check-traceability.py (self-tests first, every run)
#   Q9:  fuzz-smoke — per-PR cargo-fuzz smoke, fixed budget (mount point
#        below); the nightly long run is a separate scheduled workflow, and
#        cargo-fuzz needs its own nightly-toolchain pin, independent of
#        rust-toolchain.toml
#   P13/Q10: audit-deny — LANDED at P13 as cargo-deny ONLY (decision D19:
#        no cargo-audit — deny's advisories check reads the same RUSTSEC
#        DB); job name kept (required-status context). Q10 owns permanent
#        operation + the Q29 licenses completion. The weekly scheduled run
#        independent of PR traffic is .github/workflows/advisory-cron.yml
#   Q2:  secret-guard — LANDED: vault-export/wallet-key signature grep with
#        a planted-fake self-test each run (testdata/README.md convention)
#   Q15/Q16/Q19/Q31: devnet E2E venue / anchor-fixture lane / playwright
#        page lane / release + signing — later milestones, new jobs or
#        workflows
#   P14: LANDED as the NEW lane `wasm32-core-tests` (a new required-status
#        context, +1 on the branch-protection payload — see
#        docs/ci-verification.md). It executes antseal-core's unit tests on
#        wasm32-unknown-unknown through the node runner wired as cargo's
#        `runner` in .cargo/config.toml, and audits the getrandom recipe
#        (feature `js` for the 0.2 line, `wasm_js` + --cfg
#        getrandom_backend="wasm_js" for 0.3/0.4 — the `--cfg` half lives in
#        .cargo/config.toml) plus the wasm-bindgen crate/CLI pin equality.
#        `wasm32-core` keeps its build-only job. Doc: docs/wasm-toolchain.md
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rustup show (toolchain from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rustup show (toolchain from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    env:
      # Q3 (docs/testing/proptest-conventions.md): CI runs 4x the local
      # default case count. Seeds stay fixed per proptest! block, so the
      # extra cases are a longer deterministic sequence, not lost
      # reproducibility.
      #
      # NOTE (corrected 2026-07-28): this variable OVERRIDES a hardcoded
      # `cases` in a proptest! block, not the other way round — the macro
      # re-applies the environment on top of the config it is handed. A
      # spec-mandated floor therefore cannot be expressed in the macro at
      # all; it must bypass it and drive TestRunner directly (see C3's
      # info_encoding_is_structurally_injective and
      # docs/testing/proptest-conventions.md §4).
      PROPTEST_CASES: "1024"
    steps:
      - uses: actions/checkout@v4
      - name: rustup show (toolchain from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  # antseal-core must ALWAYS build for wasm32-unknown-unknown: WASM-safety is
  # enforced from the stub stage (MVP-SPEC.md M0 — "wasm32 build in CI from
  # day one"). The getrandom recipe now lives in .cargo/config.toml and is
  # audited by the `wasm32-core-tests` lane below (P14).
  wasm32-core:
    name: wasm32-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rustup show (toolchain from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p antseal-core --target wasm32-unknown-unknown --locked

  # P14 (new context): antseal-core's unit tests EXECUTE on
  # wasm32-unknown-unknown — the spec's WASM requirement is about behavior on
  # the verifier's real target, which a build lane alone cannot show.
  #
  # How it runs (docs/wasm-toolchain.md): a Rust libtest binary built for this
  # target has ZERO imports and exports `main` + `memory`, so
  # `scripts/wasm-test-runner.mjs` executes it under plain
  # `WebAssembly.instantiate` in node — no wasm-bindgen, no browser, nothing
  # that would pre-empt decision D18. cargo invokes it automatically via the
  # `runner` in .cargo/config.toml. Stdout does not exist on this target, so
  # the runner also asserts the in-memory execution witness (non-vacuity:
  # "all tests passed" and "zero tests ran" are otherwise indistinguishable).
  #
  # Second step: the getrandom-recipe + wasm-bindgen-pin audit. It is green
  # and inert today (no wasm32 graph pulls getrandom, nothing installs
  # wasm-bindgen-cli) and goes red the moment either arrives unconfigured.
  wasm32-core-tests:
    name: wasm32-core-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rustup show (toolchain from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show
      - uses: Swatinem/rust-cache@v2
      - name: node version (wasm host; floor asserted by the runner, not pinned)
        run: node --version
      - name: Execute antseal-core unit tests on wasm32-unknown-unknown
        run: cargo test -p antseal-core --lib --target wasm32-unknown-unknown --locked
      - name: Audit the getrandom recipe and the wasm-bindgen pin equality
        run: ./scripts/wasm-toolchain-audit.sh

  # antseal-core's NORMAL dependency graph must never gain an async runtime,
  # network, or I/O crate (WASM-safety + churn isolation; MVP-SPEC.md
  # Architecture). The list approximates "std::net users and friends" and is
  # extended as offenders appear; it fails loudly naming the offender.
  core-dep-graph:
    name: core-dep-graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rustup show (toolchain from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Assert antseal-core normal deps are I/O-free
        run: |
          set -u
          forbidden='^(tokio|async-std|smol|hyper|reqwest|mio|socket2) '
          tree="$(cargo tree -p antseal-core -e normal --prefix none --locked)"
          printf '%s\n' "$tree"
          offenders="$(printf '%s\n' "$tree" | grep -E "$forbidden" || true)"
          if [ -n "$offenders" ]; then
            echo ""
            echo "::error::antseal-core's normal dependency graph contains forbidden I/O/async/network crates:"
            printf '%s\n' "$offenders"
            echo "antseal-core must stay WASM-safe: no async runtimes, no network/socket/HTTP crates"
            echo "(MVP-SPEC.md Architecture; docs/dependency-policy.md)."
            exit 1
          fi
          echo "OK: antseal-core normal dep graph is free of forbidden crates."

  # ── Q1: cross-OS lane ──────────────────────────────────────────────────────
  # Proves byte-identical behavior of the cross-platform-sensitive suites on
  # linux, macOS, and Windows (MVP-SPEC.md Verification: the M0 UTF-8 corpus
  # must be "cross-platform stable"; golden vectors must verify identically
  # everywhere). Suite membership is by RESERVED TEST-NAME MARKER
  # (CONTRIBUTING.md "Cross-OS suite naming"): any test whose fully-qualified
  # libtest name contains `corpus_` (G3 UTF-8 corpus) or `vector_` (Q4 golden
  # vectors) runs here on all three OSes.
  #
  # Allowed-empty BY DESIGN: no such tests exist yet, so the filtered run
  # matches zero tests and passes, and the step logs a loud notice that the
  # suite set is empty. G3 and Q4 populate it; nothing here changes then.
  #
  # Scope is `-p antseal-core` deliberately: canonicalization and vector
  # verification are antseal-core by architecture, and the 3-OS lane must not
  # depend on the heavyweight net/anchor dependency stacks (ant-core et al.)
  # building on Windows/macOS — upstream churn stays out of the
  # cross-platform proof. A future suite that cannot live in antseal-core
  # extends this lane's package list; that edit belongs to the task landing
  # the suite (a reviewed lane-content change, not a fold-in of unrelated
  # steps).
  #
  # Context names are decoupled from runner labels via matrix.label, so
  # pinning a runner image later never renames a required status context.
  # Fixture byte-exactness on Windows checkouts (image sets
  # core.autocrlf=true) is guarded by .gitattributes (`testdata/** -text`).
  cross-os:
    name: cross-os-${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # Never cancel sibling OSes: a divergence report needs all three
      # verdicts, not just the first failure.
      fail-fast: false
      matrix:
        include:
          - label: linux
            runner: ubuntu-latest
          - label: macos
            runner: macos-latest
          - label: windows
            runner: windows-latest
    defaults:
      run:
        # One portable script for all three OSes (Git Bash on the Windows
        # runner); also gives pipefail semantics everywhere.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: rustup show (toolchain from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Run cross-platform-sensitive suites (corpus_/vector_ filters; allowed-empty)
        run: |
          set -u
          cargo test -p antseal-core --locked -- corpus_ vector_
          matched="$(cargo test -p antseal-core --locked -- corpus_ vector_ --list 2>/dev/null | grep -c ': test$' || true)"
          echo "cross-OS suite: matched ${matched} test(s) for reserved-name filters [corpus_ vector_]"
          if [ "${matched}" -eq 0 ]; then
            echo "::notice title=cross-OS suite set is EMPTY::No corpus_*/vector_* tests exist yet — this lane is vacuously green by design (Q1). G3 (UTF-8 corpus) and Q4 (golden vectors) populate it."
          fi

  # ── Mount-point jobs (Q1) — remaining: tamper-matrix (Q7), fuzz-smoke (Q9) ─
  # Each job below reserves a permanent required-status context for a lane
  # whose content lands with a later task. They are real jobs (not comment
  # stubs) so branch protection can list the final context set ONCE, before
  # any content exists, and never be edited again — "allowed-empty, later
  # required" (tasks/Q.md Q1). Until its task lands, a green mount-point
  # lane asserts NOTHING; the step logs say so loudly. The owning task
  # replaces the placeholder step(s) with real ones (checkout →
  # rustup-from-toolchain-file → rust-cache → content, matching the lanes
  # above) and MUST keep the job id and `name:` byte-identical.

  # Q4 (live): native golden-vector runner — walks testdata/vectors/
  # (no hardcoded lists; discovery contract in testdata/vectors/README.md),
  # executes every committed vector of every format version through
  # antseal_core::test_util::vectors; malformed/unclassifiable files and
  # empty discovery all fail loudly. The libtest `vector_` filter selects
  # exactly the reserved-marker golden-vector suite (runner +
  # per-component vector-pinning tests like hkdf_golden). The cross-os
  # lane runs the same suite on all three OSes; this context is the
  # dedicated always-required golden-vector gate. Q6's append-only freeze
  # guard lands as a sibling job or extends this one (Q6's call).
  golden-vectors:
    name: golden-vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rustup show (toolchain from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Run the golden-vector suite (vector_ reserved-name marker)
        run: |
          set -u
          cargo test -p antseal-core --locked -- vector_
          matched="$(cargo test -p antseal-core --locked -- vector_ --list 2>/dev/null | grep -c ': test$' || true)"
          echo "golden-vector suite: matched ${matched} test(s) for reserved-name filter [vector_]"
          if [ "${matched}" -eq 0 ]; then
            echo "::error::golden-vector suite is EMPTY — the Q4 runner tests must always match; the vector_ marker or the runner is broken"
            exit 1
          fi

  # F14 (Q11-co-owned): the INDEPENDENT CROSS-CHECK lane (decision D31), and
  # an input to the Q14 format freeze. No path filter — deliberately, per D31
  # §8: no job in this workflow has one, and a filter here breaks silently the
  # first time a vector directory moves.
  #
  # Today it carries F14's CBOR half. A second implementation decodes every
  # committed vector that carries a diagnostic sidecar, renders it per the
  # normative table, re-encodes it with OUR OWN RFC 8949 §4.2.1 encoder, and
  # re-derives work_id/anchor_digest — all against the COMMITTED bytes, never
  # against fresh output from our codec. Contract:
  # docs/testing/cbor-cross-check.md.
  #
  # D31's role split is what makes this evidence rather than a round-trip:
  # cbor2 DECODES only (its canonical mode is RFC 7049 length-first key order,
  # which merely coincides with §4.2.1 over today's uint keys), and the
  # encoder plus the canonicality judgement are ours. That is tier T1, an
  # independent re-implementation — which cannot see a SHARED MISREADING of
  # the spec, so the run opens with a T0 external oracle: the RFC 8949
  # Appendix A worked examples, in both directions.
  #
  # cbor2 is a DEV TOOL, hash-pinned in requirements-crosscheck.txt, and never
  # enters any Rust dependency graph (docs/dependency-policy.md §5) — the
  # drift-guard step below refuses to let its name appear in a Cargo manifest.
  #
  # Like vector-freeze and secret-guard, the lane SELF-TESTS FIRST: eight
  # planted faults (seven in-memory mutations of a real committed case —
  # including a sidecar whose map entries are correct but REORDERED, the
  # mutation a set comparison would wave through — plus a deliberately wrong
  # RFC expectation) must each go red before a green cross-check is trusted.
  #
  # New vectors need no lane change: discovery is a directory walk, scope is
  # "commits a diagnostic sidecar", and scripts/cross-check.sh iterates
  # testdata/vectors/v*/ so a future v2/ is picked up automatically.
  #
  # Q11 (D31 §6a) adds the remaining surfaces to scripts/cross-check.sh once
  # the existing reference generators grow a --check mode; they are listed in
  # that script so the gap is visible rather than absent.
  cross-check:
    name: cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned independent CBOR implementation (D7 §D12, D31)
        run: pip install --require-hashes -r requirements-crosscheck.txt
      - name: Self-test — prove the cross-check can go red
        run: ./scripts/cross-check.sh --self-test --require
      - name: Independent cross-check over every committed vector
        run: ./scripts/cross-check.sh --check --require
      - name: Drift guard — the two implementations of the rendering table agree
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo test -p antseal-core --all-features --locked --test cbor_crosscheck_contract

  # Q6 (live): the golden-vector FREEZE + must-exist guard. Each
  # testdata/vectors/v<n>/FROZEN.sha256 pins the exact bytes of every
  # committed vector of that format version AND is that version's must-exist
  # list — the `golden-vectors` lane above can only fail on files it finds,
  # so a DELETED vector is invisible to it and is caught here. Two
  # independent layers run: coreutils `sha256sum -c` (shares no code with
  # antseal) and the authoritative checker
  # crates/antseal-core/tests/vector_freeze.rs (directive vocabulary,
  # unfrozen/misfiled/stray classes, per-version retention, and the `#!
  # pending` must-exist obligations whose emptiness is Q14's gate
  # condition). New vectors need no lane change: discovery is a directory
  # walk, and the manifest line is appended with `--update`.
  #
  # Like `secret-guard` and `wasm-bitmatch`, the lane SELF-TESTS FIRST: it
  # mutates and deletes a vector in a scratch copy of the tree and requires
  # the digest check to go red, so a green run is trustworthy.
  vector-freeze:
    name: vector-freeze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rustup show (toolchain from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Self-test — a mutated/deleted frozen vector MUST turn the lane red
        run: ./scripts/vector-freeze.sh --self-test
      - name: Freeze + must-exist guard over every retained format version
        run: ./scripts/vector-freeze.sh

  # Q5 (live): WASM/native bit-match. Every committed golden vector is
  # executed through antseal_core::test_util::vectors on BOTH targets and the
  # resulting transcripts — report bytes + the per-vector recomputed digests —
  # must be byte-identical, SHA-256 included (MVP-SPEC.md lines 167/169).
  #
  # The harness is crates/wasm-bitmatch (test-only, never published, no
  # wasm-bindgen — so decision D18 stays free). Its build.rs embeds the
  # vectors by walking testdata/vectors/, so NEW VECTORS ARE COVERED WITH NO
  # CHANGE HERE — including the M2 anchor vectors, whose wasm32 coverage is an
  # explicit M2 exit criterion.
  #
  # The self-test runs FIRST, every run, in the spirit of `secret-guard`: it
  # injects a wasm32-only platform divergence and requires the comparison to
  # go RED. Only then is a green comparison trustworthy. It rebuilds a clean
  # artifact before returning, and step 2 rebuilds from scratch anyway.
  wasm-bitmatch:
    name: wasm-bitmatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rustup show (toolchain from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show
      - uses: Swatinem/rust-cache@v2
      - name: node version (wasm host; floor asserted by the runner, not pinned)
        run: node --version
      - name: Self-test — an injected wasm32-only divergence MUST turn the lane red
        run: ./scripts/wasm-bitmatch.sh --self-test
      - name: Native <-> wasm32 bit-match over every committed golden vector
        run: ./scripts/wasm-bitmatch.sh

  # Q7 + Q8 (live): the tamper matrix, both halves.
  #
  # Q7 (harness): every registered mutation row produces exactly its expected
  # stable error code / verdict state, expected outcomes are pairwise
  # distinct across domains, and no row may panic.
  #
  # Q8 (completeness): testdata/tamper/MATRIX.json maps MVP-SPEC.md line
  # 168's enumeration 1:1 onto implemented rows. Each family's `spec_quote`
  # must be a literal substring of that line, so a family cannot be invented
  # and a reworded spec turns this red rather than drifting. Every spec case
  # is implemented or carries a `pending` marker naming the owning task
  # (F15/G19/R7/R8); every implemented row is either mapped to a spec case
  # or declared in `project_added` with a justification; and mutations that
  # deliberately will NOT become rows are recorded with their reasons.
  # **Zero pending is Q14's gate condition**, printed by this lane every run.
  tamper-matrix:
    name: tamper-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rustup show (toolchain from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Tamper harness self-tests (colliding codes, panicking row)
        run: cargo test -p antseal-core --locked --lib -- test_util::tamper
      - name: Tamper registry + Q8 completeness (--nocapture prints the Q14 gate)
        run: |
          set -u
          cargo test -p antseal-core --locked --test tamper_matrix --test tamper_crypto -- --nocapture
          matched="$(cargo test -p antseal-core --locked --test tamper_matrix --list 2>/dev/null | grep -c ': test$' || true)"
          echo "tamper-matrix suite: matched ${matched} test(s) in the registry target"
          if [ "${matched}" -eq 0 ]; then
            echo "::error::tamper-matrix registry target is EMPTY — the harness or the completeness check is broken"
            exit 1
          fi

  # Q9: per-PR cargo-fuzz smoke — fixed seconds per target (e.g. 90 s), F's
  # manifest/bundle CBOR targets first, A's DER/`.ots` targets at M2 (Q17).
  # Needs its own pinned NIGHTLY toolchain (cargo-fuzz), independent of
  # rust-toolchain.toml — that pin arrives with Q9. The nightly long run with
  # corpus persistence is a separate scheduled workflow, not a PR context.
  fuzz-smoke:
    name: fuzz-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Mount point — content lands at Q9
        run: |
          echo "MOUNT POINT (Q1): required-status context 'fuzz-smoke' is reserved."
          echo "No fuzz targets exist yet. Green here asserts NOTHING until Q9 lands the smoke run."
          echo "Q9: replace this step's body; never rename the job (branch-protection context)."

  # P13 (live; permanent operation + licenses completion = Q10): cargo-deny
  # ONLY per decision D19 (docs/decisions/D19-advisory-lane.md) — no
  # cargo-audit; deny's `advisories` check consumes the same RUSTSEC DB.
  # Config: deny.toml (advisories/bans/sources active; licenses STUBBED
  # until Q29 — hence the explicit check list, never a bare `check`).
  # Job name kept from the Q1 mount point: it is a required-status context.
  # The weekly scheduled run independent of PR traffic lives in
  # .github/workflows/advisory-cron.yml (same pinned tool, same command).
  # cargo-deny is exact-pinned per docs/dependency-policy.md §5; bump =
  # deliberate event (§4). The version literal appears in the two workflow
  # files + the policy doc — grep '0\.19\.8' to move all at once.
  audit-deny:
    name: audit-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rustup show (toolchain from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Cache pinned cargo-deny binary
        id: deny-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.19.8-${{ runner.os }}
      - name: Install pinned cargo-deny (docs/dependency-policy.md §5)
        if: steps.deny-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --version 0.19.8 --locked
      - name: cargo deny (advisories, bans, sources — licenses stubbed until Q29)
        run: |
          cargo deny --version
          cargo deny --locked check advisories bans sources

  # Q2: secret-material guard (testdata/README.md, "Secret-material
  # convention"; project rule 6). Greps the checkout for vault-export /
  # wallet-key file signatures; each run FIRST proves the detector works by
  # planting fakes in a temp dir (test-of-the-test — never committed).
  # Patterns are spelled with character classes so this file cannot match
  # itself; scan excludes .git/, target/, .github/ (this script) and *.md
  # (prose may discuss the formats). A future legit source literal (e.g. a
  # keystore-import parser) extends the exclusions in the same PR as a
  # reviewed event.
  secret-guard:
    name: secret-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vault-export / wallet-key signature guard (self-test, then scan)
        run: |
          set -u
          scan() {
            # $1 = directory. Prints hits; returns 0 = clean, 1 = hit.
            local root="$1" hits=""
            ex() { grep -rlaE --exclude-dir=.git --exclude-dir=target \
                     --exclude-dir=.github --exclude='*.md' -e "$1" "$root" || true; }
            # (1) PEM private-key blocks (wallet/signing keys, any flavor).
            hits+="$(ex '[-]{5}BEGIN[ A-Z0-9]*PRIVATE KEY[-]{5}')"$'\n'
            # (2) EVM keystore JSON (web3 secret storage): both signature
            #     keys must appear in the same file.
            local a b
            a="$(ex '"ciphertext"')" ; b="$(ex '"kdfparams"')"
            hits+="$(comm -12 <(printf '%s\n' "$a" | sort -u) <(printf '%s\n' "$b" | sort -u))"$'\n'
            # (3) Reserved antseal vault-export magic (testdata/README.md:
            #     the U12 vault format must embed it so strays are
            #     detectable).
            hits+="$(ex 'ANTSEAL[ ]VAULT[ ]EXPORT')"$'\n'
            # (4) age / minisign secret-key markers.
            hits+="$(ex 'AGE[-]SECRET[-]KEY[-]1')"$'\n'
            hits+="$(ex 'minisign encrypted secret key')"$'\n'
            hits="$(printf '%s\n' "$hits" | grep -v '^$' | sort -u || true)"
            if [ -n "$hits" ]; then
              printf '%s\n' "$hits"
              return 1
            fi
            return 0
          }
          # Self-test FIRST, every run: planted fakes in a temp dir MUST
          # trigger every pattern class before the repo verdict is trusted.
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          printf 'fake for guard self-test\n-----BEGIN EC PRIVATE KEY-----\nAAAA\n-----END EC PRIVATE KEY-----\n' > "$tmp/fake-wallet.pem"
          printf '{"version":3,"crypto":{"ciphertext":"00","cipherparams":{},"kdf":"scrypt","kdfparams":{"n":1},"mac":"00"}}\n' > "$tmp/fake-keystore.json"
          printf 'ANTSEAL VAULT EXPORT v0 guard-self-test\n' > "$tmp/fake-vault-export.bin"
          printf 'AGE-SECRET-KEY-1SELFTESTSELFTESTSELFTEST\n' > "$tmp/fake-age.key"
          planted=4
          found="$(scan "$tmp" | wc -l)" || true
          if [ "$found" -ne "$planted" ]; then
            echo "::error::secret-guard self-test FAILED: planted $planted fakes, detected $found — the detector is broken; fix it before trusting a green scan"
            scan "$tmp" || true
            exit 1
          fi
          echo "self-test OK: all $planted planted fakes detected in the temp dir"
          # The real scan.
          if ! scan .; then
            echo "::error::secret-guard: vault-export/wallet-key file signature(s) found (paths above). No real secret material may ever be committed (project rule 6; testdata/README.md)."
            exit 1
          fi
          echo "OK: no vault-export/wallet-key signatures in the tree."

  # Q13 (live) + Q37: the two checks over documented claims that nothing else
  # verifies. Neither needs cargo, so this lane is seconds, not minutes.
  #
  #   --matrix           docs/testing/verification-matrix.md maps every
  #                      Verification-section bullet (MVP-SPEC.md lines
  #                      165-175) to named tests. The check asserts every
  #                      reference RESOLVES: a named Rust test is defined in
  #                      the named file, a doc-test line lands on a fence, a
  #                      named path exists. Rows are referenced BY NAME, never
  #                      by line number, because D83 will move the GGM
  #                      cover-node encoding and its tests with it.
  #   --freeze-boundary  D84 section 7's v1-freeze-boundary rows are carried
  #                      byte-identically by tasks/Q.md (the Q14 checklist)
  #                      and docs/format/anchor-artifact-limits.md (what A5
  #                      and A11 read). The check re-cuts the text from the
  #                      decision record and byte-compares every copy.
  #
  # Like secret-guard, vector-freeze and wasm-bitmatch, the lane SELF-TESTS
  # FIRST: it corrupts each target in a scratch copy of the tree and requires
  # red, so a green run is trustworthy rather than merely green.
  traceability:
    name: traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self-test (prove both checks can fail), then check
        run: |
          set -u
          python3 --version
          if ! python3 scripts/check-traceability.py --self-test; then
            echo "::error::traceability self-test FAILED — a check stayed green over corrupted input, so a green run below would prove nothing"
            exit 1
          fi
          python3 scripts/check-traceability.py
