# R26 — publish the verifier page to the ONE canonical URL, https://antseal.org/
#
# TRIGGER IS MANUAL, DELIBERATELY. `workflow_dispatch` and nothing else. Two
# reasons were recorded, and only the second one still holds:
#
#   1. RETIRED 2026-09-12 (Q65, the public flip). It said Actions minutes are
#      metered and that no other job provisions wasm-bindgen-cli and wasm-pack.
#      Both are false now: standard hosted runners are free on a public repo,
#      and `ci.yml` and `verifier-page.yml` run `wasm-tools-provision.sh` too.
#   2. A deploy is an outward-facing act at a real domain. It should happen when
#      a maintainer decides it happens, not as a side effect of a merge.
#
# PREREQUISITES, none of which this workflow can create (D62 §3):
#   * Settings -> Pages -> Source: GitHub Actions, custom domain antseal.org
#   * the apex A records pointing at Pages, and Porkbun's parking records GONE
#     — until they are, the URL serves a third party's scripted page over
#     plaintext, which is worse than failing closed (D62 §3 R7)
#   * Enforce HTTPS, which only becomes available once the certificate issues
#
# The page's Content-Security-Policy is NOT here and must never be: the ruled
# host emits no security headers and has no configuration surface, so every
# security property lives inside the hashed artifact (D62 §3 R6, D129 §5 R6).
# A second policy at the host would intersect with the in-artifact one silently.
#
# THIS JOB IS ALSO A REPRODUCIBILITY GATE — the DEPLOY one (R86; D168 §2 R3).
# `pages-publish.sh --build` builds this commit's module a THIRD time under a
# different checkout path and a different $CARGO_HOME and refuses to continue
# if the two disagree. The STEP ORDER below is what makes that an enforcement
# rather than a report: `build and check the page` precedes
# `actions/configure-pages`, `upload-pages-artifact` and `deploy-pages`, so a
# red ends the job with nothing staged and nothing published. Do not reorder it,
# and do not move the build after `configure-pages` for tidiness.
#
# Since D168 §2 R1 the same comparison is ALSO a required push context,
# `reproducible-build.yml`, on every push to `main` and every pull request. That
# lane checks the TREE; only this step checks the build that is SERVED, which is
# why it stays (D168 §2 R3). The tier, the conditions it holds under, and the
# refused arms are at the top of `scripts/reproducible-build.sh`.
name: pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Armed at WORKFLOW level, like every other workflow in this repository, so a
# job added here later inherits the policy rather than quietly opting out of it
# (docs/testing/anchor-ci-policy.md; asserted by `scripts/ci-lanes.sh
# anchor-net-policy`). It costs this workflow nothing — the page build touches
# no calendar, esplora or RPC — and the deploy and its Content-Type/encoding
# verification are ordinary HTTP to the host, which this variable does not gate.
env:
  ANTSEAL_NO_REAL_ANCHOR_NETWORK: "1"
  # D173 §2 R9/R11 — the no-real-STORAGE-network gate, the anchor gate's twin,
  # armed here for the same reason. It makes antseal-net's storage
  # constructors refuse any bootstrap peer that is not loopback before the
  # payer's `eth_chainId` call and before `Client::connect`; the loopback
  # devnet is admitted. `0` is the only off switch; unset, a debug build is
  # armed and a release build is not, so this line is what reaches any
  # release-profile step. Required in EVERY workflow by the same lane as the
  # anchor arming (`scripts/ci-lanes.sh anchor-net-policy`). Policy:
  # CONTRIBUTING.md, "No real storage network in tests".
  ANTSEAL_NO_REAL_STORAGE_NETWORK: "1"

# One deploy at a time; never cancel one in flight, because a half-replaced
# canonical URL is worse than a late one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Q255: keep this job's pages-write token out of .git/config, where
          # every later step, third-party code included, could read it. Nothing
          # after checkout runs networked git. This narrows exposure and does not
          # close it: `id-token: write` stays in every step's environment.
          persist-credentials: false
      - name: rustup show (toolchain from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show
      # NO Actions cache in this job, deliberately (D171 §2 R3). Its output is
      # the served page, and any live job on `main` can create cache entries
      # whatever its `GITHUB_TOKEN` holds. Cargo does not re-check a cached
      # `.crate`, an extracted source tree or `target/` against `Cargo.lock`,
      # and the two-environment comparison in the next step cannot see a
      # poisoned `.crate` or a poisoned tool in `~/.cargo/bin` (D171 §1.1,
      # §1.4). With nothing restored, every crate is downloaded and checked
      # against its `Cargo.lock` checksum, and the wasm tools are installed at
      # their pinned versions. That is the price, and it is not zero: on the one
      # warm deploy measured, the cache skipped both `cargo install`s, 335 s of
      # the cold run's 452 s build step (D135 §1.4) — and that skip is exactly
      # the restored-tool layer the comparison cannot see. D135 §5 R1's "build A
      # may use the job's cache" is superseded by D171 §2 R3. Every job granted
      # `pages`, `contents` or `id-token` write is held to this by
      # `scripts/check-write-job-cache.py` (D171 §2 R5).
      # Q279, ruled 2026-10-17 and recorded as a dated D63 §5 R5 rider: the
      # network is used in THIS step and never by the build. It installs the
      # pinned wasm tools and runs `cargo fetch --locked`, which checks every
      # crate against its Cargo.lock checksum. The build step after it runs
      # with CARGO_NET_OFFLINE=true, so no cargo process in it (wasm-pack's own
      # `cargo metadata` included) can reach the network, and a crate this step
      # missed fails the build with cargo's message instead of being fetched
      # mid-build. This fences cargo only; build scripts and proc macros are
      # not fenced (the rider says so). Still no cache in this job (D171).
      - name: install the pinned wasm tools and fetch the locked crates (Q279)
        run: ./scripts/wasm-tools-provision.sh
      - name: build and check the page
        env:
          CARGO_NET_OFFLINE: "true"
        run: ./scripts/pages-publish.sh --build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/verifier-web
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: verify what the host actually serves
        run: ./scripts/pages-publish.sh --verify "${{ steps.deploy.outputs.page_url }}"
